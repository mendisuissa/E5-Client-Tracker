   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-003-Require-StrongMFA-Admins-AllApps','Users: בחר Directory roles → כל תפקידי Admin (Global Admin, Exchange Admin, etc.)','Cloud Apps: All cloud apps','Grant: Require authentication strength → Phishing-resistant MFA (Passkey / FIDO2 / WHfB)','אם אין Phishing-resistant: בחר Multifactor authentication + Require compliant device']}},
  {id:'p8-device',pillar:'p8',title:'CA-010: Compliant Device לאפליקציות ארגוניות',priority:'high',phase:2,
   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-010-Require-CompliantDevice-AllUsers-O365','Users: All | Exclude: BreakGlass-Exclude','Cloud Apps: Office 365 (app suite)','Grant: Require device to be marked as compliant (OR: Hybrid Joined)','ודא Intune enrollment מלא לפני Enforce — הפעל Report-Only 14 יום ובדוק Workbook']}},
  {id:'p8-locations',pillar:'p8',title:'CA-020: Named Locations + חסימת מדינות',priority:'medium',phase:2,
   guide:{portal:'Entra Admin Center',steps:['Conditional Access → Named locations → + Countries location','שם: "Allowed Countries" → בחר: Israel + USA + UK (לפי הארגון)','+ New Policy → CA-020-Block-NonAllowedCountries','Users: All | Cloud Apps: All | Conditions → Locations: Not in Allowed Countries','Grant: Block access | לחלופין: MFA חזק מחוץ לישראל בלבד']}},
  {id:'p8-signin-risk',pillar:'p8',title:'CA-030: Block High Sign-in Risk (P2)',priority:'high',phase:4,
   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-030-Block-HighSigninRisk','Users: All | Cloud Apps: All cloud apps','Conditions → Sign-in risk: High → Grant: Block access','Policy נוספת → CA-031-MFA-MediumSigninRisk → Conditions: Medium → Grant: Require MFA','דורש Entra ID P2 | בדוק Risky Sign-ins בדשבורד: Identity Protection → Risky sign-ins']}},
  {id:'p8-user-risk',pillar:'p8',title:'CA-032: Block High User Risk + Force PW Change (P2)',priority:'high',phase:4,
   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-032-Block-HighUserRisk','Users: All | Cloud Apps: All cloud apps','Conditions → User risk: High','Grant: Require password change (דורש SSPR מופעל!) + Require MFA','ודא SSPR: Entra → Users → Password reset → Self service password reset: Enabled for All']}},
  {id:'p8-session',pillar:'p8',title:'CA-050: Session Controls — Sign-in Frequency',priority:'medium',phase:3,
   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-050-Session-SigninFrequency-Admins','Users: Directory roles (Admins) | Cloud Apps: All','Session: Sign-in frequency → 4 Hours','Policy נוספת ל-BYOD: CA-051 → Persistent browser session: Never persistent','Apps רגישות (Finance, HR): Sign-in frequency → 1 Hour + Require reauthentication']}},
  {id:'p8-mam',pillar:'p8',title:'CA-060: App Protection Policy ל-Mobile BYOD',priority:'medium',phase:3,
   guide:{portal:'Entra Admin Center + Intune',steps:['Intune: Apps → App protection policies → Create iOS + Create Android','Target: Outlook, Teams, OneDrive, Edge | PIN: Required | Backup: Block | Copy/paste: Block','CA Policy → CA-060-Require-AppProtection-Mobile','Users: All | Cloud Apps: Exchange / SharePoint','Grant: Require approved client app + Require app protection policy (OR)']}},
  {id:'p8-reportonly',pillar:'p8',title:'Report-Only מעוקב — Workbook פעיל',priority:'medium',phase:2,governance:true,
   guide:{portal:'Entra Admin Center + Azure',steps:['Conditional Access → Insights and reporting → בדוק כל שבוע','Azure Monitor Workbook: CA-Insights Workbook (מובנה) → פנה ל-Azure Portal','בדוק: פוליסות Report-Only שאמורות ל-Enforce — האם עברו 7-14 יום?','Sign-in logs → KQL: SigninLogs | where ConditionalAccessStatus == "reportOnlyFailure" | summarize count() by PolicyName','סמן פוליסות בשלות ל-Enforce: שנה Status מ-Report-only ל-On']}},
  {id:'p8-tokenprotect',pillar:'p8',title:'CA-070: Token Protection (Session מוגן למכשיר)',priority:'high',phase:1,
   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-070-TokenProtection-SPO-Exchange-Teams','Users: All | Exclude: BreakGlass-Exclude | Cloud Apps: SharePoint Online + Exchange Online','Session → Token protection → Require token binding to device (מונע Pass-the-Cookie / Token Replay)','דורש Entra ID P1 + מכשירי Windows 10+ Entra Joined/Hybrid Joined — בדוק תאימות ב-Report-Only לפני Enforce']}},

  /* ── P9: AI & AGENT SECURITY (Copilot, Security Copilot, DSPM for AI) ── */
  {id:'p9-copilot',pillar:'p9',title:'Security Copilot מופעל ומוטמע (Embedded Experiences)',priority:'high',phase:6,
   guide:{portal:'securitycopilot.microsoft.com',steps:['Security Copilot → Settings → Capacity → ודא הקצאת SCUs (400 לכל 1,000 משתמשי E5, עד 10,000 מקס\' — כלול חינם מ-1.7.2026)','הפעל Embedded experiences: Defender XDR, Entra, Intune, Purview → Settings → Security Copilot integration → Enable','הגדר RBAC: Security Copilot → Permissions → הקצה Owner/Contributor לפי צוות SOC','נטר ניצול SCU חודשי: Security Copilot → Usage → Capacity report → מנע Overage בתשלום']}},
  {id:'p9-dspm-ai',pillar:'p9',title:'Purview DSPM for AI — Oversharing Assessment רץ',priority:'critical',phase:5,
   guide:{portal:'purview.microsoft.com',steps:['Solutions → DSPM (מ-9/2026 חוויה מאוחדת אחת — "for AI" כבר לא תפריט נפרד, AI risk מוצג יחד עם Data risk) → AI apps view','הפעל Oversharing assessment: זהה קבצים חשופים ל-"Everyone"/"Anyone with link" שנגישים ל-Copilot/Agents','Recommendations → יישם Sensitivity label auto-apply על קבצים רגישים לפני הרחבת Copilot; נצל Automated remediation actions לסגירת חשיפה בקליק','Activity explorer → AI apps → נטר Prompts/Responses עם נתוני DLP-sensitive (Copilot, ChatGPT Enterprise, Claude, Agents)']}},
  {id:'p9-agent-ca',pillar:'p9',title:'Microsoft Entra Agent ID — CA + ID Protection for Agents מוגדר',priority:'critical',phase:4,
   guide:{portal:'Entra Admin Center',steps:['ודא Service Plan מוקצה: Microsoft Entra Agent ID (כולל Conditional Access for Agents + ID Protection for Agents, ב-E5/E7/M365 Agent)','Identity Governance → Agent identities → סקור את כל ה-Agent IDs הרשומים (Copilot Studio, Security Copilot agents)','Conditional Access → New Policy → Assignments: Workload identities → Agent identities → הגדר Grant controls, Triggers לפי Agent risk','Identity Protection → Agent risk policies → הפעל זיהוי גישה לא מוכרת / נפח Sign-in חריג']}},
  {id:'p9-genai-discovery',pillar:'p9',title:'Generative AI App Discovery מופעל (MDCA)',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Cloud Discovery → Dashboard → סנן קטגוריה: Generative AI','זהה שימוש לא מאושר ב-ChatGPT / Gemini / Claude / DeepSeek דרך הדפדפן הארגוני','תייג Sanctioned (למשל Microsoft 365 Copilot, ChatGPT Enterprise מאושר) מול Unsanctioned','Policies → Cloud Discovery policy → Alert on new GenAI app גילוי + Risk score נמוך → שקול חסימה']}},
  {id:'p9-readiness',pillar:'p9',title:'Copilot Readiness Assessment בוצע',priority:'critical',phase:5,
   guide:{portal:'purview.microsoft.com',steps:['לפני הפעלת Copilot בהיקף רחב: הרץ Purview → DSPM → Copilot readiness report','בדוק אחוז קבצים עם הרשאות "Everyone"/"Anyone with link" שנגישים ל-Copilot','SharePoint Advanced Management → Site access review לפני Rollout','Go/No-Go decision: תעד Baseline risk score לפני הרחבה לעובדים נוספים']}},
  {id:'p9-labels-copilot',pillar:'p9',title:'Sensitivity Labels אוכפים הרשאות ב-Copilot',priority:'high',phase:5,
   guide:{portal:'purview.microsoft.com',steps:['ודא Sensitivity labels (מ-p6) אוכפים גם על תוכן שנצרך ע"י Copilot — לא רק Encryption סטטי','Auto-labeling: הרחב Policy לזהות תוכן רגיש שטרם תויג לפני חשיפה ל-Copilot','בדוק: תוכן שמסומן "Highly Confidential" חסום מ-Copilot summarization (Protection settings בתוך ה-Label)','Test: נסה לשאול Copilot על מסמך מתויג → ודא אכיפה בפועל']}},
  {id:'p9-accessgov',pillar:'p9',title:'AI Access Governance (מי רשאי להשתמש ב-Copilot/Agents)',priority:'high',phase:4,governance:true,
   guide:{portal:'Entra Admin Center + M365 Admin Center',steps:['Licenses → Copilot license assignment → ודא הקצאה מבוקרת (לא Blanket assignment לכולם ללא הצדקה)','Entra: קבוצת Security ייעודית ל-Copilot users + CA policy Scoped אליה','Copilot Studio: הגבל מי יכול לבנות/לפרסם Agents (Maker permissions)','Access reviews: סקירה רבעונית למי יש גישה ל-Copilot / Agent building tools']}},
  {id:'p9-agentgov',pillar:'p9',title:'Agent Governance Framework מוגדר',priority:'high',phase:5,governance:true,
   guide:{portal:'Power Platform Admin Center',steps:['Power Platform admin center → Agents → Environment-level DLP policies ל-Connectors שסוכנים יכולים להשתמש בהם','Publishing approval: הגדר תהליך אישור לפני פרסום Agent חדש לארגון','DLP: חסום Connectors לא מאושרים (Third-party AI, Personal email) עבור Agents','תיעוד: Catalog מרכזי לכל Agent + Owner + Purpose']}},
  {id:'p9-agentinventory',pillar:'p9',title:'Agent Inventory מלא ומעודכן',priority:'high',phase:4,governance:true,
   guide:{portal:'Entra Admin Center + Power Platform Admin Center',steps:['Entra → Identity Governance → Agent identities → Export רשימה מלאה (Copilot Studio, Security Copilot, Custom agents)','Power Platform admin center → Agents → סקור כל Environment (Prod/Dev/Test)','זהה Agents "יתומים" מבחינת זהות: שנוצרו לפני 7/2026 ועדיין רצים על App registration ישן במקום Entra Agent ID — Copilot Studio → Settings → Advanced → Metadata לבדיקה, ותכנן Migration','לכל Agent: תעד Owner, Purpose, Data access scope, Last activity · Agents יתומים ללא Owner פעיל → Deactivate']}},
  {id:'p9-agentlifecycle',pillar:'p9',title:'Agent Lifecycle Management מוגדר',priority:'medium',phase:5,governance:true,
   guide:{portal:'Power Platform Admin Center',steps:['הגדר תהליך: Agent Onboarding (אישור לפני יצירה) → Review תקופתי (רבעוני) → Decommission (Deactivate + Archive data)','Inactive agent policy: Agent ללא שימוש > 90 יום → Flag לסקירה','Offboarding: כשעובד עוזב, Ownership transfer אוטומטי ל-Agents שבבעלותו','Audit trail: תעד כל שינוי Lifecycle (Created/Modified/Retired)']}},

  /* ══ TENANT HYGIENE BASELINE (survey additions, 10/2026) ══ */
  /* ── Identity ── */
  {id:'p1-gacount',pillar:'p1',title:'Global Administrators — מספר מינימלי (עד 5) וללא חשבונות משותפים',priority:'critical',phase:1,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Entra → Roles & admins → Global Administrator → Assignments (Eligible + Active)','צמצם ל-2-4 חשבונות + 2 Break-Glass; החלף הרשאות עודפות בתפקידים ספציפיים (Exchange Admin, Intune Admin וכו)','כל Admin: חשבון Cloud-only ייעודי, ללא רישיון דואר, עם PIM Eligible','סקור רבעוני: Roles & admins → Export']}},
  {id:'p1-adminaccts',pillar:'p1',title:'חשבונות Admin ייעודיים (Cloud-only, נפרדים מחשבון יומיומי)',priority:'high',phase:1,governance:true,
   guide:{portal:'Entra Admin Center',steps:['זהה חשבונות Admin: Roles & admins → כל תפקיד מיוחס → רשימת Members','ודא שאין Admin מסונכרן מ-On-prem AD (On-premises sync enabled = No) — צור חשבון Cloud-only ייעודי','ללא רישיון Exchange/Teams לחשבון Admin; MFA עמיד-פישינג (CA-003)','Naming אחיד (למשל adm-name@domain) לזיהוי וניטור קל']}},
  {id:'p1-consent',pillar:'p1',title:'User Consent לאפליקציות מוגבל + Admin Consent Workflow',priority:'high',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Entra → Enterprise applications → Consent and permissions → User consent settings','הגדר: Allow user consent for apps from verified publishers for selected permissions (או Do not allow) — לא Allow for all apps','Admin consent settings → Admin consent requests → Enable + הגדר Reviewers','Group owner consent: Do not allow; סקור הרשאות שכבר ניתנו: Enterprise apps → Permissions']}},
  {id:'p1-sspr',pillar:'p1',title:'SSPR מופעל לכל המשתמשים עם 2 שיטות + Registration נאכף',priority:'medium',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Entra → Protection → Password reset → Properties → Self service password reset enabled: All','Authentication methods: דרוש 2 שיטות (Authenticator / FIDO2 / TAP) — לא SMS/Voice בלבד (ראה פריט ביטול SMS/Voice)','Registration: Require users to register when signing in = Yes','Admins: SSPR לאדמינים מחייב MFA ולפי מדיניות']}},
  {id:'p1-pwprotect',pillar:'p1',title:'Password Protection (Banned Passwords) + Smart Lockout מכוונן',priority:'medium',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Entra → Protection → Authentication methods → Password protection','Enforce custom banned password list: Enabled + הוסף מילים ארגוניות (שם חברה, מוצרים, עיר)','Smart lockout: Threshold (ברירת מחדל 10) + Duration (60 שניות) — כוונן לפי Sign-in logs','Hybrid: התקן Entra Password Protection Proxy + DC Agent במצב Enforced']}},
  {id:'p1-smsvoice',pillar:'p1',title:'הערכת תלות ב-SMS/Voice (MFA ו-SSPR) לפני ביטול Microsoft Telephony',priority:'high',phase:1,
   guide:{portal:'Entra Admin Center',steps:['הפק רשימת משתמשים עם SMS/Voice: Authentication methods → Activity → User registration details (כולל הגדרות Legacy MFA/SSPR)','Microsoft מפסיקה לספק SMS/Voice: 1.2.2027 לכלל המשתמשים, 1.7.2027 ל-Global Admins ומשתמשים חיצוניים (לפי Microsoft Learn — אמת ב-Message Center MC1426371 לשינוי לוחות זמנים)','תכנן מעבר: Authenticator / Passkey / FIDO2 / TAP; חלופה: ספק Telephony צד-שלישי מ-Security Store (הגדרה אמורה להיפתח ב-30.10.2026)','SSPR: SMS/Voice לא יהיו זמינים גם שם — עדכן Registration campaign בהתאם']}},
  {id:'p1-authmethods',pillar:'p1',title:'Authentication Methods Policy מאוחד (סיום Legacy MFA/SSPR + Per-user MFA)',priority:'high',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Entra → Protection → Authentication methods → Policies → Manage migration → ודא סטטוס Migration Complete','Per-user MFA: Users → Per-user MFA → ודא כל המשתמשים Disabled (אכיפה דרך Conditional Access בלבד)','Legacy MFA service settings ו-Legacy SSPR settings: ודא שהועברו ל-Policy החדש ואינם כפולים/סותרים','הגדר Target groups לכל Method (Authenticator, FIDO2, Passkey, TAP) במקום All users גורף']}},
  {id:'p1-authenticator',pillar:'p1',title:'Microsoft Authenticator מקושח (Number Matching + Additional Context)',priority:'medium',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Authentication methods → Microsoft Authenticator → Configure','Require number matching: Enabled (All users) · Show application name + geographic location: Enabled','Registration campaign: Enable → Microsoft Authenticator לדחיפת רישום','Identity Protection / Sign-in logs: חפש תבניות MFA fatigue (דחיות חוזרות)']}},
  {id:'p1-stale',pillar:'p1',title:'חשבונות Stale/Inactive (90+ יום) מנוהלים',priority:'high',phase:1,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Entra → Users: סנן Last successful sign-in מעל 90 יום (Users + Guests)','סווג: Service/Shared מתועדים · עובדים שעזבו → Disable + הסר רישיון · Guests → Access review','Access reviews: צור סקירה אוטומטית Inactive users (ID Governance → Access reviews)','יעד: פחות מ-2% חשבונות Inactive ללא נימוק מתועד']}},
  {id:'p1-appreg',pillar:'p1',title:'App Registrations & Service Principals — סודות, בעלים והרשאות',priority:'high',phase:3,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Entra → App registrations → All: עמודת Certificates & secrets — סנן Expired / עומדים לפוג תוך 30 יום','זהה Apps ללא Owner או עם הרשאות Graph רחבות (Directory.ReadWrite.All, Mail.ReadWrite, Application.ReadWrite.All) → Enterprise apps → Permissions','העדף Managed Identity / Federated credentials על Client Secrets; Secret תקף עד 6-12 חודשים','השבת/מחק Apps ללא Sign-in ב-90 יום (Enterprise apps → Sign-in logs / Unused app insights)']}},
  {id:'p1-hybrid',pillar:'p1',title:'תקינות Hybrid Identity (Entra Connect / Cloud Sync) — אם רלוונטי',priority:'high',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Entra → Entra Connect → Connect Sync / Cloud Sync → בדוק Last sync פחות מ-30 דקות ו-Sync errors = 0','גרסה: Microsoft תומכת רק בגרסאות עדכניות — השווה ל-Version history והפעל Auto-upgrade','Password Hash Sync: Enabled (תנאי ל-Leaked credentials detection ב-ID Protection) · Seamless SSO / Hybrid Join לפי צורך','שרת Connect = Tier 0: הקשחה, ללא גלישה, גיבוי; בדוק Connect Health Alerts']}},
  {id:'p1-ispm',pillar:'p1',title:'Identity Security Posture (ISPM) — המלצות MDI נסקרות',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['security.microsoft.com → Secure score / Exposure management → Identities (Identity security posture assessments)','סקור המלצות Critical/High: Unsecure Kerberos delegation, Print Spooler ב-DC, Unsecure ACLs, חשבונות עם Password never expires','תעדף לפי Exposure score impact → הקצה Owner + תאריך יעד','מדוד % המלצות שנסגרו רבעוני']}},
  {id:'p1-mscapolicies',pillar:'p1',title:'Microsoft-managed Conditional Access Policies נסקרו',priority:'medium',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Entra → Conditional Access → Policies → סנן Microsoft-managed','לכל Policy: החלט במפורש — Enable / Report-only / Exclusion מתועד (ודא Break-Glass מוחרג)','תעד החלטה ובעלים; Microsoft עשויה להפעיל Policies אלה אוטומטית אם לא טופלו','אחרי שינוי: Sign-in logs → Conditional Access tab (תוצאות Report-only)']}},
  /* ── Devices ── */
  {id:'p2-osversions',pillar:'p2',title:'מערכות הפעלה ותוכנות בתמיכה (Windows 10, Win11, Server, Office)',priority:'critical',phase:2,
   guide:{portal:'intune.microsoft.com + security.microsoft.com',steps:['Intune → Devices → All devices → Export (OS version); Defender → Vulnerability management → Software inventory / End-of-support','Windows 10: סוף תמיכה 14.10.2025 (ESU בתשלום בלבד) · Windows 11 24H2 Home/Pro יצא מתמיכה 13.10.2026 (Enterprise/Education עד 12.10.2027) · Server 2016: סוף תמיכה מורחבת ינואר 2027','תעדף שדרוג/החלפה; Feature update policy לגרסה נתמכת (25H2 ומעלה)','Office 2016/2019 יצא מתמיכה 14.10.2025 — בדוק גם Apps for Enterprise channel']}},
  {id:'p2-laps',pillar:'p2',title:'Windows LAPS פעיל לכל מכשיר Windows',priority:'high',phase:2,
   guide:{portal:'Entra + intune.microsoft.com',steps:['Entra → Devices → Device settings → Enable Local Administrator Password Recovery = Yes','Intune → Endpoint security → Account protection → LAPS policy: Backup to Entra, Rotation ≤ 30 יום, שם חשבון Admin מוגדר','השבת/שנה שם ל-Built-in Administrator; Post-authentication action: Reset password + Logoff','בדוק כיסוי: Intune → Devices → Monitor → דוח LAPS — יעד 100% Windows']}},
  {id:'p2-avhealth',pillar:'p2',title:'Defender Antivirus בריא (Real-time, Cloud Protection, Signatures, Firewall)',priority:'high',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Intune → Reports → Endpoint security → Antivirus agent status; Defender → Device inventory (AV mode, Signature age)','Real-time protection + Cloud-delivered protection (High) + PUA block: ודא דרך Intune Antivirus policy','Signature age ≤ 3 ימים; Firewall: כל 3 Profiles פעילים (Endpoint security → Firewall)','טפל במכשירים Unhealthy / Passive ללא AV צד-שלישי מוצהר']}},
  {id:'p2-secureboot',pillar:'p2',title:'Secure Boot — עדכון תעודות 2023 (פקיעת CA 2011)',priority:'critical',phase:2,
   guide:{portal:'intune.microsoft.com + Windows Update',steps:['רקע: KEK CA 2011 ו-UEFI CA 2011 פגו ביוני 2026; Windows Production PCA 2011 פג 19.10.2026 (לפי Microsoft) — מכשירים ממשיכים לאתחל אך מפסיקים לקבל עדכוני Boot-level','ודא Secure Boot מופעל + Windows Update פעיל; בדוק סטטוס Servicing ברמת מכשיר ובדוחות Intune/Autopatch אם זמינים','מכשירים ישנים/ללא תמיכה: עדכן BIOS/UEFI מהיצרן לפני הפצת התעודה','סקור גם מכונות וירטואליות (Hyper-V/VMware): תמונות ישנות דורשות טיפול נפרד']}},
  {id:'p2-credguard',pillar:'p2',title:'Credential Guard + HVCI (VBS) מופעלים',priority:'high',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Intune → Endpoint security → Account protection → Credential Guard: Enabled with UEFI lock (ב-Win11 22H2+ Enterprise מופעל כברירת מחדל במכשירים תואמים)','Settings catalog → Virtualization Based Security + Memory integrity (HVCI): Enabled','בדוק תאימות Drivers לפני Enforce בקבוצת Pilot','אימות במכשיר: msinfo32 → Virtualization-based security Running + Credential Guard']}},
  /* ── Endpoint ── */
  {id:'p3-sensorhealth',pillar:'p3',title:'בריאות Sensor MDE — Active, ללא Misconfigured/Impaired',priority:'high',phase:2,
   guide:{portal:'security.microsoft.com',steps:['Assets → Devices → סנן Onboarding status + Health state','זהה Inactive (לא דיווחו 7+ ימים), Impaired communications, Misconfigured','Tune: ודא Connectivity ל-Defender URLs, Proxy תקין, AV mode = Active','Reports → Device health: נטר שבועי; הגדר Alert על ירידה בכיסוי']}},
  {id:'p3-rbac',pillar:'p3',title:'Defender Unified RBAC + Device Groups מוגדרים',priority:'medium',phase:2,governance:true,
   guide:{portal:'security.microsoft.com',steps:['Settings → Microsoft Defender XDR → Permissions and roles → Activate unified RBAC','צור Custom roles לפי פונקציה (SOC Tier-1 Read/Respond, Security admin) — לא Global Admin','Device groups/Tags לפי קריטיות (Servers, Tier-0, VIP) — ל-Automation level ול-RBAC scope','סקור הקצאות כל 6 חודשים']}},
  /* ── Email / Exchange ── */
  {id:'p4-extfwd',pillar:'p4',title:'Auto-forwarding חיצוני חסום + Inbox Rules חשודים נסרקים',priority:'critical',phase:1,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Policies → Anti-spam → Anti-spam outbound policy → Automatic forwarding rules = Off (או Automatic - System-controlled)','בדוק ברמת תיבה: Reports → Auto forwarded messages report; סרוק Inbox rules עם Forward/Redirect חיצוני','הפעל Alert policy: Suspicious email forwarding / Creation of forwarding or redirect rule','חריגים עסקיים: Outbound policy ייעודי לקבוצה מוגבלת בלבד, מתועד']}},
  {id:'p4-smtpauth',pillar:'p4',title:'SMTP AUTH (Basic) כבוי — מיגרציה ל-OAuth/Graph',priority:'high',phase:1,
   guide:{portal:'Exchange Admin Center',steps:['Exchange admin → Settings → Mail flow → Turn off SMTP AUTH protocol for your organization (או Get-TransportConfig | fl SmtpClientAuthenticationDisabled)','מיפוי שימושים: Get-CASMailbox -ResultSize Unlimited | ? SmtpClientAuthenticationDisabled -eq $false · Sign-in logs → Client app = Authenticated SMTP','לוח זמנים (Microsoft, עודכן 27.1.2026): עד דצמבר 2026 ללא שינוי · סוף דצמבר 2026 כבוי כברירת מחדל ללקוחות קיימים · הסרה סופית מחצית שנייה 2027','אפליקציות/מדפסות: מעבר ל-OAuth, Graph sendMail, High Volume Email או Connector מבוסס IP/Certificate']}},
  {id:'p4-directsend',pillar:'p4',title:'Direct Send מנוהל — RejectDirectSend',priority:'high',phase:1,
   guide:{portal:'Exchange Online PowerShell',steps:['זהה מקורות Direct Send (מדפסות/סורקים/אפליקציות ששולחות ל-MX ללא אימות עם Domain פנימי) — Message trace','החלף: Inbound connector (IP או Certificate), או SMTP AUTH עם OAuth / Graph','Set-OrganizationConfig -RejectDirectSend $true (אימות: Get-OrganizationConfig; ייתכן עד 30 דקות Propagation)','אחרי הפעלה: נטר NDR 550 5.7.68 לזיהוי מקורות לגיטימיים שנשכחו']}},
  {id:'p4-legacyprotos',pillar:'p4',title:'פרוטוקולי Legacy (POP/IMAP) כבויים למי שלא צריך',priority:'medium',phase:1,
   guide:{portal:'Exchange Online PowerShell',steps:['Get-CASMailbox -ResultSize Unlimited | ? {$_.PopEnabled -or $_.ImapEnabled} | select PrimarySmtpAddress','כבה POP/IMAP כברירת מחדל (Set-CASMailboxPlan) ולמשתמשים בודדים לפי צורך','Authentication policy: חסום Basic auth בפרוטוקולי Exchange (השלמה ל-CA-002)','תעד חריגים עם Owner וסיבה עסקית']}},
  {id:'p4-sharedmbx',pillar:'p4',title:'Shared Mailbox — Sign-in חסום וללא רישיון',priority:'medium',phase:1,
   guide:{portal:'Exchange + Entra',steps:['Get-EXOMailbox -RecipientTypeDetails SharedMailbox | % { Get-User $_.ExternalDirectoryObjectId } | ? AccountDisabled -eq $false','Entra → Users → סנן Shared mailboxes → Block sign-in = Yes (Account enabled = No)','ודא שאין רישיון משויך (למעט Archive/מעל 50GB) ושאין סיסמה מוכרת','גישה דרך Full Access / Send As בלבד ולא Sign-in ישיר']}},

let APP = { clients: [], version: 2 };

let currentPillar = 'p1';
let currentPhase = 0;
let editingItemId = null;
let editingItemStatus = 'pending';
let editingItemPriority = 'medium';

function save(syncClientId) {
  localStorage.setItem('e5tracker_v2', JSON.stringify(APP));
  if (syncClientId) pushClientToSP(syncClientId); // async fire-and-forget
}
function load() {
  const raw = localStorage.getItem('e5tracker_v2');
  if (raw) { try { APP = JSON.parse(raw); } catch(e) {} }
  // Migration: ensure all clients have entries for any new items added since creation
  APP.clients.forEach(c => {
    ITEMS.forEach(item => {
      if (!c.items[item.id]) {
        c.items[item.id] = { status:'pending', date:'', assignee:'', notes:'', blocker:'', priority:item.priority };
      }
    });
  });
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function createClient(data) {
  const c = {
    id: genId(),
    name: data.name,
    contact: data.contact || '',
    consultant: data.consultant || '',
    startDate: data.startDate || '',
    targetDate: data.targetDate || '',
    mode: data.mode || 'cloud',
    licenses: data.licenses || '',
    notes: data.notes || '',
    items: {},
    activityLog: [],
    createdAt: new Date().toISOString(),
  };
  // Init all items as pending
  ITEMS.forEach(item => {
    c.items[item.id] = {
      status: 'pending',
      date: '',
      assignee: '',
      notes: '',
      blocker: '',
      priority: item.priority,
    };
  });
  APP.clients.push(c);
  save(c.id); // also push new client to SharePoint if connected
  return c;
}

function getClient(id) { return APP.clients.find(c => c.id === id); }

function deleteClient(id) {
  const c = getClient(id);
  if (c?._spItemId) deleteClientFromSP(c._spItemId); // async cleanup in SP
  APP.clients = APP.clients.filter(cl => cl.id !== id);
  save();
}

// ── PROGRESS CALC ────────────────────────────
// A "partial" item (enabled in Audit mode / partial coverage) earns half credit everywhere scores are computed.
const STATUS_CREDIT = {done:1, partial:0.5};
function statusCredit(status) { return STATUS_CREDIT[status] || 0; }

function progressOf(client, items) {
  const relevant = items.filter(i => client.items[i.id]?.status !== 'na');
  const done = relevant.filter(i => client.items[i.id]?.status === 'done').length;
  const partial = relevant.filter(i => client.items[i.id]?.status === 'partial').length;
  const credit = relevant.reduce((s, i) => s + statusCredit(client.items[i.id]?.status), 0);
  return { done, partial, total: relevant.length, pct: relevant.length ? Math.round(credit / relevant.length * 100) : 0 };
}

function getPillarProgress(client, pillarId) {
  return progressOf(client, ITEMS.filter(i => i.pillar === pillarId));
}

function getOverallProgress(client) {
  return progressOf(client, ITEMS);
}

function getBlockers(client) {
  return ITEMS.filter(i => client.items[i.id]?.blocker?.trim());
}

// ── E5 SCORECARD (V2) ────────────────────────
// Layer 1 = Adoption Score: plain completion %, unweighted (reuses getOverallProgress/getPillarProgress).
// Layer 2 = Weighted Score: priority-weighted completion, so a missed Critical hurts far more than a missed Low.
// Layer 3 = Maturity Level: label lookup on top of a weighted score.
const PRIORITY_WEIGHT = {critical:5, high:3, medium:2, low:1};

const MATURITY_LEVELS = [
  {max:25,  label:'Initial',    color:'#dc2626'},
  {max:50,  label:'Developing', color:'#d97706'},
  {max:75,  label:'Managed',    color:'#0078d4'},
  {max:90,  label:'Mature',     color:'#16a34a'},
  {max:100, label:'Optimized',  color:'#0369a1'},
];
function getMaturityLevel(score) {
  return MATURITY_LEVELS.find(l => score <= l.max) || MATURITY_LEVELS[MATURITY_LEVELS.length - 1];
}

// Generic weighted-completion calc over any item subset: Σ(weight×done) / Σ(weight×relevant) × 100.
// NA items are excluded from both sums, same convention as getPillarProgress.
function getWeightedScore(client, itemsSubset) {
  let doneWeight = 0, totalWeight = 0;
  itemsSubset.forEach(item => {
    const data = client.items[item.id];
    if (!data || data.status === 'na') return;
    const w = PRIORITY_WEIGHT[data.priority || item.priority] || 2;
    totalWeight += w;
    doneWeight += w * statusCredit(data.status);
  });
  return totalWeight ? Math.round(doneWeight / totalWeight * 100) : 0;
}

function getPillarWeightedScore(client, pillarId) {
  return getWeightedScore(client, ITEMS.filter(i => i.pillar === pillarId));
}

// Security Score domains: extends the Identity/Endpoint/Email/Data/Cloud model with SIEM/Detection (Sentinel),
// since detection coverage is as core to "how protected are we" as the control pillars themselves.
const SECURITY_DOMAINS = [
  {key:'identity',  label:'זהות',            pillars:['p1','p8'], weight:25},
  {key:'endpoint',  label:'Endpoint',        pillars:['p2','p3'], weight:20},
  {key:'email',     label:'Email',           pillars:['p4'],      weight:15},
  {key:'data',      label:'Data (DLP/Labels)', pillars:['p6'],    weight:15},
  {key:'cloudapps', label:'Cloud Apps',      pillars:['p5'],      weight:10},
  {key:'detection', label:'SIEM/Detection',  pillars:['p7'],      weight:15},
];
function getSecurityScore(client) {
  let total = 0;
  SECURITY_DOMAINS.forEach(d => {
    const domainItems = ITEMS.filter(i => d.pillars.includes(i.pillar));
    total += getWeightedScore(client, domainItems) * (d.weight / 100);
  });
  return Math.round(total);
}

// Governance Score: not pillar-based — pulls every item tagged governance:true across all pillars
// (Access Reviews, Entitlement Mgmt, Lifecycle Workflows, Records Mgmt, Legal Hold, Adaptive Protection,
// RBAC, Agent Governance/Inventory/Lifecycle, etc.) Answers "is there process/oversight", not "is the toggle on".
function getGovernanceItems() {
  return ITEMS.filter(i => i.governance);
}
function getGovernanceScore(client) {
  return getWeightedScore(client, getGovernanceItems());
}

function getAdoptionScore(client) {
  return getOverallProgress(client).pct;
}

// ── ACTIVITY LOG ─────────────────────────────
function logActivity(clientId, itemId, action, note) {
  const c = getClient(clientId);
  if (!c) return;
  c.activityLog.unshift({
    id: genId(),
    timestamp: new Date().toISOString(),
    itemId,
    action, // 'done' | 'undone' | 'note' | 'blocker'
    note: note || '',
  });
  // Keep max 200 entries
  if (c.activityLog.length > 200) c.activityLog = c.activityLog.slice(0, 200);
  save();
}

function escHtml(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function copyVerifyCmd(itemId, btn) {
  const text = VERIFY[itemId]?.cmd || '';
  const done = () => { btn.textContent = '✓ הועתק'; setTimeout(() => { btn.textContent = '📋 העתק'; }, 1500); };
  const fallback = () => {
    const pre = btn.previousElementSibling;
    const range = document.createRange(); range.selectNodeContents(pre);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    btn.textContent = 'סומן — Ctrl+C';
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

function verifyBoxHtml(itemId) {
  const v = VERIFY[itemId];
  if (!v) return '';
  return `<div class="verify-box">
    <div class="vb-row"><span class="vb-lbl">🔍 איך לבדוק:</span> ${v.check}</div>
    ${v.cmd ? `<div class="vb-cmd-wrap"><pre class="vb-cmd" dir="ltr">${escHtml(v.cmd)}</pre><button class="vb-copy" type="button" onclick="event.stopPropagation();copyVerifyCmd('${itemId}',this)">📋 העתק</button></div>` : ''}
    <div class="vb-row vb-pass"><span class="vb-lbl">✅ Pass כש:</span> ${v.pass}</div>
    ${v.evidence ? `<div class="vb-row vb-ev"><span class="vb-lbl">📎 ראיה לתיעוד:</span> ${v.evidence}</div>` : ''}
  </div>`;
}

  const guideHtml = item.guide ? `
    <div class="item-guide" id="guide-${item.id}">
      ${verifyBoxHtml(item.id)}
      <div class="guide-portal">📍 ${item.guide.portal}</div>
      <ol>${item.guide.steps.map(s=>`<li>${s}</li>`).join('')}</ol>

  return `<div class="checklist-item-wrap">
    <div class="checklist-item ${isDone ? 'done' : ''} ${isPartial ? 'partial-item' : ''} ${isNA ? 'na-item' : ''}" onclick="openItemModal('${item.id}')">
      <div class="item-check ${isDone ? 'checked' : isPartial ? 'partial' : ''}">${isDone ? '✓' : isPartial ? '◐' : isNA ? '—' : ''}</div>

          ${isPartial ? `<span style="font-size:.72rem;color:#0e7490;font-weight:600">◐ חלקי / Audit</span>` : ''}
          ${isNA ? `<span style="font-size:.72rem;color:var(--muted)">לא רלוונטי</span>` : ''}
        </div>
      </div>
      <div style="font-size:.7rem;color:var(--muted);margin-right:auto;padding-right:8px">שלב ${item.phase}</div>

// ── ACTIVITY LOG ─────────────────────────────
function renderLog(c) {
  if (!c.activityLog || !c.activityLog.length) {
    document.getElementById('log-container').innerHTML = '<div class="empty-log">📭 אין פעילות עדיין. התחל לסמן פריטים!</div>';
    return;
  }
  const html = c.activityLog.map(entry => {
    const item = ITEMS.find(i => i.id === entry.itemId);
    const pillar = item ? PILLARS.find(p => p.id === item.pillar) : null;
    const dotClass = entry.action === 'done' ? 'log-dot-done' : entry.action === 'undone' ? 'log-dot-undone' : 'log-dot-note';
    const icon = entry.action === 'done' ? '✅' : entry.action === 'partial' ? '◐' : entry.action === 'undone' ? '↩️' : entry.action === 'blocker' ? '🚧' : '📝';
    const actionText = entry.action === 'done' ? 'הושלם' : entry.action === 'partial' ? 'סומן כחלקי / Audit' : entry.action === 'undone' ? 'בוטל' : entry.action === 'blocker' ? 'Blocker נוסף' : 'עודכן';
    return `<div class="log-entry">
      <div class="log-dot ${dotClass}">${icon}</div>
      <div class="log-body">
        <div class="log-title">${item ? item.title : entry.itemId} — <strong>${actionText}</strong></div>
        <div class="log-meta">${pillar ? pillar.icon + ' ' + pillar.short + ' · ' : ''}${formatDate(entry.timestamp)}</div>
        ${entry.note ? `<div class="log-note">${entry.note}</div>` : ''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('log-container').innerHTML = html;
}

function clearLog() {
  if (!confirm('למחוק את כל הלוג? פעולה זו אינה הפיכה.')) return;

}

function setStatus(s) { editingItemStatus = s; updateStatusBtns(s); }
function updateStatusBtns(s) {
  ['done','partial','pending','na'].forEach(st => {
    const btn = document.getElementById('btn-status-' + st);
    btn.className = 'status-btn' + (s === st ? ' active-' + st : '');
  });
}

function setPriority(p) { editingItemPriority = p; updatePriorityBtns(p); }
function updatePriorityBtns(p) {
  document.querySelectorAll('.priority-btn').forEach(btn => {
    const bP = btn.getAttribute('data-p');
    btn.className = 'priority-btn' + (bP === p ? ' sel-' + p : '');
  });
}

function closeItemModal() { document.getElementById('modal-item').classList.remove('open'); }

function saveItem() {
  const c = getClient(currentClientId);
  const itemId = editingItemId;
  const prev = { ...c.items[itemId] };
  const date = document.getElementById('item-date').value;
  const assignee = document.getElementById('item-assignee').value;
  const notes = document.getElementById('item-notes').value;
  const blocker = document.getElementById('item-blocker').value;

  c.items[itemId] = {
    status: editingItemStatus,
    date: editingItemStatus === 'done' && !date ? new Date().toISOString().split('T')[0] : date,
    assignee,
    notes,
    blocker,
    priority: editingItemPriority,
  };

  // Log changes
  if (prev.status !== editingItemStatus) {
    const action = editingItemStatus === 'done' ? 'done' : editingItemStatus === 'partial' ? 'partial' : editingItemStatus === 'pending' ? 'undone' : 'note';
    logActivity(currentClientId, itemId, action, notes || '');
  } else if (blocker && prev.blocker !== blocker) {
    logActivity(currentClientId, itemId, 'blocker', blocker);
  } else if (notes && prev.notes !== notes) {
    logActivity(currentClientId, itemId, 'note', notes);
  }

  save(currentClientId); // sync this client to SharePoint
  closeItemModal();
  renderClientView();
  toast(editingItemStatus === 'done' ? '✅ פריט הושלם!' : editingItemStatus === 'partial' ? '◐ סומן כחלקי / Audit' : '💾 נשמר', editingItemStatus === 'done' ? 'success' : '');
}

// ── Sync status UI ──────────────────────────────
function setSyncStatus(state, extra) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    disabled:  { icon: '☁️', text: 'לא מחובר', color: 'rgba(255,255,255,.5)' },
    idle:      { icon: '☁️', text: 'התחבר ל-SharePoint', color: '#fff' },
    connected: { icon: '🔗', text: 'מחובר — לחץ לסנכרון', color: '#86efac' },
    login:     { icon: '🔐', text: 'התחבר...', color: '#fbbf24' },
    syncing:   { icon: '🔄', text: 'מסנכרן...', color: '#7dd3fc' },
    ok:        { icon: '✅', text: 'מסונכרן', color: '#86efac' },
    error:     { icon: '❌', text: 'שגיאת Sync', color: '#fca5a5' },
  };
  const s = map[state] || map.disabled;
  el.textContent = s.icon + ' ' + (extra || s.text);
  el.style.color = s.color;
  el.title = (state === 'syncing' ? 'לחץ לביטול — ' : '') + (extra || s.text);
  el.classList.toggle('syncing', state === 'syncing' || state === 'login');
}

function handleSyncClick() {
  if (!SP_CONFIG.enabled) {
    alert('SharePoint Sync לא מוגדר עדיין.\n\nמלא את SP_CONFIG בקוד:\n• clientId\n• tenantId\n• enabled: true');
    return;
  }
  // If currently stuck on syncing — allow click-to-reset
  const el = document.getElementById('sync-status');
  if (el && (el.textContent.includes('מסנכרן') || el.textContent.includes('מאמת'))) {
    _clearMsalState();
    setSyncStatus('idle');
    toast('🔄 סנכרון אופס — לחץ שוב לניסיון חוזר', '');
    return;
  }
  const accounts = _msal?.getAllAccounts() || [];
  if (!accounts.length) {
    spLogin();
  } else {
    setSyncStatus('syncing');
    const SYNC_TIMEOUT_MS = 25000;
    const syncOp = (async () => {
      await ensureLists();
      await pullFromSP();
      await syncAllPending();
    })();
    const timeout = new Promise((_, rej) =>
      setTimeout(() => rej(new Error('Timeout — לחץ לניסיון חוזר')), SYNC_TIMEOUT_MS));
    Promise.race([syncOp, timeout])
      .then(() => setSyncStatus('ok'))
      .catch(e => {
        console.error('Sync error:', e);
        setSyncStatus('error', e.message?.substring(0,40));
      });
  }
}

async function initSharePoint() {
  if (!SP_CONFIG.enabled) { setSyncStatus('disabled'); return; }
  setSyncStatus('idle');
  try {
    _msal = new msal.PublicClientApplication({
      auth: {
        clientId: SP_CONFIG.clientId,
        authority: `https://login.microsoftonline.com/${SP_CONFIG.tenantId}`,
        redirectUri: MAIN_URL,
      },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
    });
    await _msal.initialize();
    // Handle response from loginRedirect / acquireTokenRedirect
    const response = await _msal.handleRedirectPromise();
    if (response) {
      // Check if we redirected for a token refresh mid-sync
      const resumeSync = sessionStorage.getItem('resumeSyncAfterRedirect');
      if (resumeSync) {
        sessionStorage.removeItem('resumeSyncAfterRedirect');
        setSyncStatus('syncing');
        try {
          await ensureLists();
          await pullFromSP();
          await syncAllPending();
          setSyncStatus('ok');
        } catch(e) {
          console.error('Resume sync error:', e);
          setSyncStatus('error', e.message?.substring(0,40));
        }
        return;
      }
      // Normal login redirect — wait for user to click sync
      setSyncStatus('idle');
      toast('✅ נכנסת! לחץ שוב לסנכרון', 'success');
      return;
    }
    // Existing session — auto-sync only on desktop
    const accounts = _msal.getAllAccounts();
    if (accounts.length > 0 && !isMobile()) {
      setSyncStatus('syncing');
      await ensureLists();
      await pullFromSP();
      setSyncStatus('ok');
    } else if (accounts.length > 0) {
      setSyncStatus('connected'); // mobile: authenticated, waiting for manual sync
    }
  } catch(e) {
    console.error('SP init error:', e);
    setSyncStatus('error', e.message?.substring(0,40));
  }
}

async function spLogin() {
  if (!_msal) return;
  setSyncStatus('login');
  const scopes = ['https://graph.microsoft.com/Sites.ReadWrite.All', 'User.Read'];
  _clearMsalState();
  try {
    await _msal.loginRedirect({ scopes, redirectUri: MAIN_URL });
  } catch(e) {
    console.error('SP login error:', e);
    setSyncStatus('error');
    toast('שגיאה בהתחברות: ' + (e.message||''), 'danger');
  }
}

function _clearMsalState() {
  ['localStorage','sessionStorage'].forEach(store => {
    Object.keys(window[store])
      .filter(k => k.startsWith('msal.') || k.includes('interaction.status'))
      .forEach(k => window[store].removeItem(k));
  });
  _interacting = false;
}

// ── Graph helper ────────────────────────────────
async function _token() {
  const acc = _msal.getAllAccounts();
  if (!acc.length) throw new Error('Not authenticated');
  const scopes = ['https://graph.microsoft.com/Sites.ReadWrite.All'];
  try {
    return (await _msal.acquireTokenSilent({ scopes, account: acc[0] })).accessToken;
  } catch(e) {
    if (isMobile()) throw new Error('נדרשת כניסה מחדש — לחץ על כפתור הסנכרון');
    // Use redirect instead of popup — popup gets blocked by Chrome
    _clearMsalState();
    sessionStorage.setItem('resumeSyncAfterRedirect', '1');
    setSyncStatus('login', 'מאמת מחדש...');
    await _msal.acquireTokenRedirect({ scopes, account: acc[0], redirectUri: MAIN_URL });
    // Page navigates away — nothing below executes
    throw new Error('Redirecting for re-auth');
  }
}

async function graph(method, path, body) {
  const token = await _token();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method,
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (method === 'DELETE') return null;
  const json = await r.json();
  if (!r.ok) throw new Error(json?.error?.message || r.status);
  return json;
}

// ── List setup ──────────────────────────────────
async function _siteIdCached() {
  if (_siteId) return _siteId;
  const s = await graph('GET', `/sites/${SP_CONFIG.siteHost}:${SP_CONFIG.sitePath}`);
  _siteId = s.id;
  return _siteId;
}

async function ensureLists() {
  const sid = await _siteIdCached();
  const res = await graph('GET', `/sites/${sid}/lists?$select=id,displayName`);
  const existing = {};
  res.value.forEach(l => existing[l.displayName] = l.id);

  // ── E5_Clients ──
  if (!existing[SP_CONFIG.clientsListName]) {
    toast('🔧 יוצר רשימות SharePoint...', '');
    const l = await graph('POST', `/sites/${sid}/lists`, {
      displayName: SP_CONFIG.clientsListName,
      columns: [
        { name: 'ClientId', text: {} },
        { name: 'DataJson', text: { allowMultipleLines: true, linesForEditing: 20, maxLength: 65535 } },
      ],
      list: { template: 'genericList' }
    });
    _listId = l.id;
    toast('✅ רשימה E5_Clients נוצרה', 'success');
  } else {
    _listId = existing[SP_CONFIG.clientsListName];
  }

  // ── E5_ActivityLog ──
  if (!existing[SP_CONFIG.logListName]) {
    const l = await graph('POST', `/sites/${sid}/lists`, {
      displayName: SP_CONFIG.logListName,
      columns: [
        { name: 'ClientId', text: {} },
        { name: 'ClientName', text: {} },
        { name: 'ItemId', text: {} },
        { name: 'Action', text: {} },
        { name: 'Note', text: { allowMultipleLines: true } },
        { name: 'ActionTimestamp', text: {} },
        { name: 'UpdatedBy', text: {} },
      ],
      list: { template: 'genericList' }
    });
    _logListId = l.id;
  } else {
    _logListId = existing[SP_CONFIG.logListName];
  }
}

// ── Pull from SharePoint → localStorage ─────────
async function pullFromSP() {
  const sid = await _siteIdCached();
  const res = await graph('GET',
    `/sites/${sid}/lists/${_listId}/items?$expand=fields($select=Title,ClientId,DataJson,id)&$top=500`);
  const spClients = [];
  for (const item of res.value) {
    const f = item.fields;
    if (!f?.DataJson) continue;
    try {
      const cd = JSON.parse(f.DataJson);
      cd._spItemId = item.id;
      spClients.push(cd);
    } catch(e) { console.warn('Bad JSON for', f.Title); }
  }
  if (spClients.length > 0) {
    // Merge: SP is source of truth
    APP.clients = spClients;
    save();
    renderDashboard();
    toast(`☁️ נטענו ${spClients.length} לקוחות מ-SharePoint`, 'success');
  }
}

// ── Push single client → SharePoint ─────────────
async function pushClientToSP(clientId) {
  if (!SP_CONFIG.enabled || !_msal) return;
  const accounts = _msal.getAllAccounts();
  if (!accounts.length) { _pendingSync.add(clientId); return; }
  const c = getClient(clientId);
  if (!c) return;
  setSyncStatus('syncing');
  try {
    const sid = await _siteIdCached();
    if (!_listId) await ensureLists();
    // Strip circular / large fields before saving
    const payload = JSON.stringify(c);
    const fields = { Title: c.name, ClientId: c.id, DataJson: payload };
    if (c._spItemId) {
      await graph('PATCH', `/sites/${sid}/lists/${_listId}/items/${c._spItemId}/fields`, fields);
    } else {
      const item = await graph('POST', `/sites/${sid}/lists/${_listId}/items`, { fields });
      c._spItemId = item.fields?.id || item.id;
      localStorage.setItem('e5tracker_v2', JSON.stringify(APP)); // update cached spItemId
    }
    // Log activity entries (last 3 unsent)
    if (_logListId) {
      const unsynced = (c.activityLog || []).filter(e => !e._spSynced).slice(0, 5);
      for (const entry of unsynced) {
        const item = ITEMS.find(i => i.id === entry.itemId);
        await graph('POST', `/sites/${sid}/lists/${_logListId}/items`, {
          fields: {
            Title: c.name + ' — ' + (item?.title || entry.itemId),
            ClientId: c.id,
            ClientName: c.name,
            ItemId: entry.itemId,
            Action: entry.action,
            Note: entry.note || '',
            ActionTimestamp: entry.timestamp,
            UpdatedBy: _msal.getAllAccounts()[0]?.username || '',
          }
        });
        entry._spSynced = true;
      }
      save();
    }
    setSyncStatus('ok');
  } catch(e) {
    console.error('Push error:', e);
    setSyncStatus('error', e.message?.substring(0,40));
    _pendingSync.add(clientId);
  }
}

async function deleteClientFromSP(spItemId) {
  if (!SP_CONFIG.enabled || !_msal || !spItemId) return;
  const accounts = _msal.getAllAccounts();
  if (!accounts.length) return;
  try {
    const sid = await _siteIdCached();
    if (!_listId) await ensureLists();
    await graph('DELETE', `/sites/${sid}/lists/${_listId}/items/${spItemId}`);
  } catch(e) { console.warn('SP delete error:', e); }
}

async function syncAllPending() {
  const ids = [..._pendingSync];
  _pendingSync.clear();
  for (const id of ids) await pushClientToSP(id);
  setSyncStatus('ok');
}

// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = 'toast', 2500);
}

function download(filename, content) {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(content);
  a.download = filename;
  a.click();
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return 'עכשיו';
  if (diff < 3600) return Math.round(diff/60) + ' דק\'';
  if (diff < 86400) return Math.round(diff/3600) + ' שעות';
  if (diff < 604800) return Math.round(diff/86400) + ' ימים';
  return new Date(iso).toLocaleDateString('he-IL');
}

function formatDate(iso, short) {
  const d = new Date(iso);
  if (short) return d.toLocaleDateString('he-IL');
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit',minute:'2-digit'});
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

load();
showDashboard();
initSharePoint(); // Phase 2: connect to SharePoint if SP_CONFIG.enabled = true
