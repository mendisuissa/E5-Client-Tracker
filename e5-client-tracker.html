<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E5 Client Tracker — מעקב יישום לקוחות</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.min.js"></script>
<style>
:root {
  --primary:#0f3460; --primary-light:#1a5296; --primary-dark:#071d3b;
  --ms-blue:#0078d4; --gold:#f59e0b; --gold-light:#fef3c7;
  --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626;
  --p1:#6366f1; --p2:#0891b2; --p3:#dc2626; --p4:#7c3aed;
  --p5:#0369a1; --p6:#7c2d8e; --p7:#1a4080; --p8:#047857; --p9:#e11d48;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','Arial Hebrew',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;direction:rtl;min-height:100vh;}

/* ── TOP NAV ── */
.topbar{background:var(--primary-dark);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;}
.topbar-brand .badge{background:var(--gold);color:#000;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:10px;}
.topbar-actions{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;font-size:.82rem;font-weight:600;border:none;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--ms-blue);color:#fff;}
.btn-primary:hover{background:#005a9e;}
.btn-gold{background:var(--gold);color:#000;}
.btn-gold:hover{background:#d97706;}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-sm{padding:5px 11px;font-size:.75rem;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#15803d;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--bg);}

/* ── VIEWS ── */
.view{display:none;padding:28px;max-width:1280px;margin:0 auto;}
.view.active{display:block;}

/* ── DASHBOARD ── */
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.dash-header h1{font-size:1.5rem;font-weight:800;color:var(--primary);}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stat-card .num{font-size:2rem;font-weight:800;color:var(--primary);}
.stat-card .lbl{font-size:.75rem;color:var(--muted);margin-top:2px;}
.clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;position:relative;}
.client-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.12);transform:translateY(-2px);}
.client-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.client-name{font-size:1.05rem;font-weight:700;color:var(--primary);}
.client-mode-badge{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.mode-cloud{background:#d1fae5;color:#065f46;}
.mode-hybrid{background:#fef3c7;color:#78350f;}
.mode-comgmt{background:#dbeafe;color:#1e3a8a;}
.client-meta{font-size:.78rem;color:var(--muted);margin-bottom:14px;}
.client-meta span{margin-left:12px;}
.overall-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:6px;}
.overall-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ms-blue),var(--p1));transition:width .5s;}
.overall-pct{font-size:.78rem;font-weight:700;color:var(--primary);margin-bottom:12px;}
.pillar-mini-bars{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;}
.pillar-mini-bar{text-align:center;}
.pillar-mini-bar .icon{font-size:.85rem;}
.pillar-mini-bar .pct{font-size:.6rem;color:var(--muted);}
.pillar-mini-bar .bar{height:4px;background:#e2e8f0;border-radius:2px;margin-top:2px;overflow:hidden;}
.pillar-mini-bar .bar-fill{height:100%;border-radius:2px;transition:width .5s;}
.card-actions{position:absolute;top:12px;left:12px;display:flex;gap:4px;opacity:0;transition:opacity .2s;}
.client-card:hover .card-actions{opacity:1;}
.empty-state{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-state .icon{font-size:4rem;margin-bottom:16px;}
.empty-state h2{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:8px;}

/* ── CLIENT VIEW ── */
.client-view-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));color:#fff;border-radius:var(--radius);padding:24px 28px;margin-bottom:24px;}
.client-view-header .breadcrumb{font-size:.78rem;opacity:.7;margin-bottom:6px;cursor:pointer;}
.client-view-header .breadcrumb:hover{opacity:1;}
.client-view-header h1{font-size:1.5rem;font-weight:800;margin-bottom:8px;}
.client-view-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:.82rem;opacity:.85;}
.client-view-meta span{display:flex;align-items:center;gap:4px;}
.client-view-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.progress-overview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.progress-overview h3{font-size:1rem;font-weight:700;color:var(--primary);margin-bottom:14px;}
.progress-big{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.progress-circle{width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--ms-blue) 0deg, #e2e8f0 0deg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:var(--primary);flex-shrink:0;}
.progress-details{flex:1;}
.progress-bar-main{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:6px;}
.progress-bar-main-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ms-blue),var(--p1));transition:width .5s;}
.pillars-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;}
.pillar-progress-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 8px;text-align:center;}
.pillar-progress-card .p-icon{font-size:1.4rem;}
.pillar-progress-card .p-name{font-size:.62rem;font-weight:600;color:var(--muted);margin:4px 0;}
.pillar-progress-card .p-pct{font-size:1rem;font-weight:800;}
.pillar-progress-card .p-bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:6px;}
.pillar-progress-card .p-bar-fill{height:100%;border-radius:3px;transition:width .5s;}
.pillar-tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;flex-wrap:wrap;}
.pillar-tab{padding:9px 14px;border:none;background:none;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.pillar-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
.pillar-tab .tab-pct{font-size:.65rem;padding:1px 5px;border-radius:8px;background:var(--bg);}
.pillar-tab.active .tab-pct{background:var(--accent, #dbeafe);color:var(--primary);}
.checklist-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.checklist-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.checklist-header h3{font-size:.95rem;font-weight:700;color:var(--primary);}
.checklist-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.checklist-item:last-child{border-bottom:none;}
.checklist-item:hover{background:var(--bg);}
.checklist-item.done{background:#f0fdf4;}
.checklist-item.done:hover{background:#dcfce7;}
.item-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.75rem;transition:all .15s;}
.item-check.checked{background:var(--success);border-color:var(--success);color:#fff;}
.item-body{flex:1;min-width:0;}
.item-title{font-size:.86rem;font-weight:500;color:var(--text);}
.item-title.done{text-decoration:line-through;color:var(--muted);}
.item-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;}
.item-date{font-size:.72rem;color:var(--muted);}
.item-assignee{font-size:.72rem;color:var(--muted);}
.item-blocker{font-size:.72rem;color:var(--danger);font-weight:600;}
.priority-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.priority-critical{background:var(--danger);}
.priority-high{background:var(--warning);}
.priority-medium{background:var(--ms-blue);}
.priority-low{background:var(--muted);}
.item-note-preview{font-size:.72rem;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.checklist-item-wrap{border-bottom:1px solid var(--border);}
.checklist-item-wrap .checklist-item{border-bottom:none;}
.btn-guide{background:none;border:1px solid #bfdbfe;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:.78rem;color:var(--ms-blue);flex-shrink:0;transition:all .15s;line-height:1;}
.btn-guide:hover{background:#dbeafe;border-color:var(--ms-blue);}
.item-guide{display:none;padding:14px 20px 16px;background:#f0f7ff;border-top:1px dashed #bfdbfe;}
.item-guide.open{display:block;}
.guide-portal{display:inline-flex;align-items:center;gap:4px;background:var(--ms-blue);color:#fff;font-size:.68rem;font-weight:700;padding:2px 10px;border-radius:10px;margin-bottom:10px;}
.item-guide ol{padding-right:18px;margin:0;}
.item-guide ol li{font-size:.8rem;color:var(--text);margin-bottom:6px;line-height:1.5;}

/* ── ACTIVITY LOG ── */
.log-timeline{padding:8px 0;}
.log-entry{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);}
.log-entry:last-child{border-bottom:none;}
.log-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;margin-top:2px;}
.log-dot-done{background:#d1fae5;color:var(--success);}
.log-dot-undone{background:#fee2e2;color:var(--danger);}
.log-dot-note{background:#dbeafe;color:var(--ms-blue);}
.log-body{flex:1;}
.log-title{font-size:.86rem;font-weight:600;color:var(--text);}
.log-meta{font-size:.75rem;color:var(--muted);margin-top:2px;}
.log-note{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:4px;}
.empty-log{text-align:center;padding:40px;color:var(--muted);font-size:.9rem;}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius);padding:28px;max-width:520px;width:100%;margin:20px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.modal h2{font-size:1.05rem;font-weight:800;color:var(--primary);margin-bottom:20px;}
.modal-pillar-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;color:#fff;margin-bottom:16px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:5px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;direction:rtl;transition:border .15s;}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--ms-blue);}
.form-group textarea{resize:vertical;min-height:80px;}
.form-group.blocker-group textarea{border-color:#fca5a5;}
.form-group.blocker-group textarea:focus{border-color:var(--danger);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.priority-btns{display:flex;gap:6px;}
.priority-btn{flex:1;padding:6px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-size:.75rem;font-weight:700;text-align:center;background:var(--bg);color:var(--muted);transition:all .15s;}
.priority-btn.sel-critical{background:#fee2e2;border-color:var(--danger);color:var(--danger);}
.priority-btn.sel-high{background:#fffbeb;border-color:var(--warning);color:var(--warning);}
.priority-btn.sel-medium{background:#dbeafe;border-color:var(--ms-blue);color:var(--ms-blue);}
.priority-btn.sel-low{background:#f1f5f9;border-color:var(--muted);color:var(--muted);}
.status-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.status-btn{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:.85rem;font-weight:600;border:none;background:var(--bg);color:var(--muted);transition:all .15s;}
.status-btn.active-done{background:var(--success);color:#fff;}
.status-btn.active-partial{background:#0891b2;color:#fff;}
.status-btn.active-pending{background:var(--warning);color:#fff;}
.status-btn.active-na{background:var(--muted);color:#fff;}
.status-btn{font-size:.78rem;padding:10px 4px;}
.verify-box{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.78rem;line-height:1.55;}
.verify-box .vb-row{margin-bottom:5px;}
.verify-box .vb-row:last-child{margin-bottom:0;}
.verify-box .vb-lbl{font-weight:700;color:var(--ms-blue);}
.verify-box .vb-pass .vb-lbl{color:var(--success);}
.verify-box .vb-ev .vb-lbl{color:var(--muted);}
.vb-cmd-wrap{position:relative;margin:6px 0 8px;}
.vb-cmd{direction:ltr;text-align:left;unicode-bidi:isolate;background:#0f172a;color:#e2e8f0;border-radius:6px;padding:8px 10px 8px 64px;font-family:Consolas,'Courier New',monospace;font-size:.74rem;line-height:1.5;overflow-x:auto;white-space:pre;margin:0;}
.vb-copy{position:absolute;top:5px;left:5px;font-size:.65rem;padding:2px 8px;border:none;border-radius:4px;background:#334155;color:#fff;cursor:pointer;}
.vb-copy:hover{background:#475569;}
.item-check.partial{background:linear-gradient(90deg,#0891b2 50%,transparent 50%);border-color:#0891b2;color:#fff;}
.checklist-item.partial-item{background:#f0fdfa;}
.ri-status-partial{background:#cffafe;color:#155e75;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;}

/* ── REPORT VIEW ── */
.report-view{max-width:860px;margin:0 auto;}
.report-header{background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));color:#fff;border-radius:var(--radius);padding:32px 36px;margin-bottom:24px;}
.report-header h1{font-size:1.8rem;font-weight:800;margin-bottom:4px;}
.report-header .subtitle{opacity:.8;font-size:.9rem;}
.report-badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.report-badge{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:4px 12px;font-size:.75rem;font-weight:600;}
.report-exec{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.report-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.report-stat .n{font-size:1.8rem;font-weight:800;color:var(--primary);}
.report-stat .l{font-size:.75rem;color:var(--muted);margin-top:2px;}
.report-pillar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px;}
.report-pillar-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.report-pillar-header .icon{font-size:1.3rem;}
.report-pillar-header h3{font-size:.95rem;font-weight:700;flex:1;}
.report-pillar-header .pct{font-size:1rem;font-weight:800;}
.report-pbar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:12px;}
.report-pbar-fill{height:100%;border-radius:4px;transition:width .5s;}
.report-items{display:flex;flex-direction:column;gap:2px;}
.report-item{display:flex;flex-direction:column;gap:3px;padding:7px 0;border-bottom:1px dashed var(--border);}
.report-item:last-child{border-bottom:none;}
.report-item-main{display:flex;align-items:center;gap:8px;font-size:.82rem;}
.report-item .ri-check{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0;}
.report-item .ri-done{background:var(--success);color:#fff;}
.report-item .ri-pend{background:#e2e8f0;color:var(--muted);}
.report-item .ri-title{flex:1;}
.report-item .ri-date{font-size:.7rem;color:var(--muted);}
.report-item-meta{font-size:.72rem;color:var(--muted);padding-right:24px;display:flex;gap:12px;flex-wrap:wrap;}
.report-item-note{font-size:.76rem;color:var(--text);padding-right:24px;}
.report-item-note::before{content:'📝 ';}
.report-item-blocker{font-size:.76rem;color:var(--danger);font-weight:600;padding-right:24px;}
.report-item-blocker::before{content:'🚧 ';}
.ri-status-badge{font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:8px;flex-shrink:0;white-space:nowrap;}
.ri-status-done{background:#d1fae5;color:#065f46;}
.ri-status-pending{background:#fef3c7;color:#92400e;}
.ri-status-na{background:#e2e8f0;color:var(--muted);}
.ri-priority-badge{font-size:.6rem;font-weight:700;padding:1px 7px;border-radius:8px;flex-shrink:0;white-space:nowrap;}
.report-nextsteps{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;padding:16px;margin-bottom:14px;}
.report-nextsteps h3{font-size:.9rem;font-weight:700;color:var(--ms-blue);margin-bottom:10px;}
.nextstep-item{padding:8px 0;border-bottom:1px solid #dbeafe;}
.nextstep-item:last-child{border-bottom:none;}
.nextstep-item-head{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;flex-wrap:wrap;}
.nextstep-item-meta{font-size:.74rem;color:var(--muted);margin-top:3px;}
.nextstep-item-meta .blocker{color:var(--danger);font-weight:600;}
.scorecard-composite{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.scorecard-card{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:18px;text-align:center;}
.scorecard-card .sc-label{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:6px;}
.scorecard-card .sc-score{font-size:2.2rem;font-weight:800;}
.scorecard-card .sc-maturity{font-size:.72rem;font-weight:700;margin-top:6px;padding:2px 10px;border-radius:10px;display:inline-block;color:#fff;}
.scorecard-table{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.scorecard-table h3{font-size:.9rem;font-weight:700;color:var(--primary);margin-bottom:4px;}
.scorecard-table .sct-note{font-size:.7rem;color:var(--muted);margin-bottom:12px;}
.scw-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.scw-row:last-child{border-bottom:none;}
.scw-name{width:150px;flex-shrink:0;font-weight:600;display:flex;align-items:center;gap:5px;}
.scw-bar-wrap{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.scw-bar-fill{height:100%;border-radius:4px;}
.scw-score{width:36px;text-align:left;font-weight:700;flex-shrink:0;}
.scw-maturity{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:8px;color:#fff;white-space:nowrap;flex-shrink:0;width:76px;text-align:center;}
.mini-scorecard{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.mini-score-badge{flex:1;min-width:110px;background:var(--bg);border-radius:8px;padding:8px 12px;text-align:center;border:1px solid var(--border);}
.mini-score-badge .msb-label{font-size:.66rem;color:var(--muted);font-weight:600;}
.mini-score-badge .msb-value{font-size:1.3rem;font-weight:800;}
.report-blockers{background:#fff5f5;border:1px solid #fca5a5;border-radius:10px;padding:16px;margin-bottom:14px;}
.report-blockers h3{font-size:.9rem;font-weight:700;color:var(--danger);margin-bottom:10px;}
.blocker-item{font-size:.83rem;padding:6px 0;border-bottom:1px solid #fecaca;display:flex;gap:8px;}
.blocker-item:last-child{border-bottom:none;}
.report-timeline{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px;}
.report-timeline h3{font-size:.95rem;font-weight:700;color:var(--primary);margin-bottom:12px;}
.rt-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.rt-item:last-child{border-bottom:none;}
.rt-date{color:var(--muted);min-width:90px;}
.report-actions{display:flex;gap:8px;margin-bottom:24px;}

/* ── ALERTS / TOASTS ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--primary);color:#fff;padding:12px 20px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:all .3s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:var(--success);}
.toast.danger{background:var(--danger);}

/* ── ALERTS ── */
.alert{padding:12px 16px;border-radius:8px;font-size:.84rem;border-right:4px solid;margin-bottom:16px;}
.alert-info{background:#dbeafe;border-color:var(--ms-blue);color:#1e3a8a;}
.alert-warning{background:#fffbeb;border-color:var(--warning);color:#92400e;}

/* ── PHASE BANNER ── */
.phase-filter{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.phase-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:.75rem;cursor:pointer;font-weight:500;color:var(--muted);transition:all .15s;}
.phase-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ── PRINT ── */
@media print{
  .topbar,.client-view-actions,.report-actions,.pillar-tabs,
  .btn,.card-actions,.phase-filter{display:none!important;}
  body{background:#fff;}
  .view{padding:0;max-width:100%;}
  .report-view{max-width:100%;}
  .report-header{border-radius:0;}
  .client-view-header{border-radius:0;}
}

  .phase-filter{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;

@media(max-width:480px){

   guide:{portal:'security.microsoft.com',steps:['Settings → Identities → Sensors → Add sensor → Download installer','התקן על כל Domain Controller (כולל Read-Only DCs)','הגדר Directory Service Account (gMSA מומלץ)','בדוק: כל Sensor בסטטוס Running (לא Stopped/Error)']}},
  {id:'p1-entitlement',pillar:'p1',title:'Entitlement Management (Access Packages) מוגדר',priority:'high',phase:4,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Identity Governance → Entitlement management → Catalogs → Create catalog','Access packages → Create access package (משאבים: קבוצות/אפליקציות/אתרי SharePoint)','Policies: Requestor scope, Approval flow, Expiration (90 יום + Access review)','בדוק: Access packages → Reports → ניצול בפועל מול בקשות ידניות','⚠️ Deadline 3.11.2026: Auto-assignment policies שמבוססות על MemberOf operator — חובה להחליף ל-Attribute-based rule']}},
  {id:'p1-lifecycle',pillar:'p1',title:'Lifecycle Workflows (Joiner/Mover/Leaver) מוגדרים',priority:'high',phase:4,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Identity Governance → Lifecycle workflows → Create workflow → Joiner template (Pre-hire)','Mover template: שינוי מחלקה → עדכון גישה אוטומטי','Leaver template: Termination date → השבתת חשבון + הסרת רישיונות','Execution conditions: טריגר לפי employeeHireDate/employeeLeaveDateTime מ-HR connector']}},
  {id:'p1-authstrength',pillar:'p1',title:'Authentication Strengths מוגדרות (מעבר ל-CA-003)',priority:'medium',phase:4,
   guide:{portal:'Entra Admin Center',steps:['Protection → Authentication methods → Authentication strengths → סקור Built-in (MFA, Passwordless MFA, Phishing-resistant)','צור Custom strength אם צריך שילוב ספציפי (למשל FIDO2 + Certificate)','שייך Strength מותאם לכל CA Policy לפי רגישות ה-Resource (לא רק לאדמינים)','בדוק: Sign-in logs → Authentication strength satisfied']}},
  {id:'p1-tap',pillar:'p1',title:'Temporary Access Pass (TAP) מוגדר',priority:'medium',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Protection → Authentication methods → Policies → Temporary Access Pass → Enable','הגדר Default lifetime + One-time use policy','תהליך תפעולי: הנפקת TAP ל-New hire / Password reset ללא תלות ב-SMS','Audit logs → נטר הנפקות TAP חריגות או תכופות מדי']}},
  {id:'p1-passkeys',pillar:'p1',title:'Passkeys כברירת מחדל להתחברות (Entra ID rollout מ-1.9.2026)',priority:'critical',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Protection → Authentication methods → Passkey (FIDO2) → ודא Enabled + הגדרות Attestation','Microsoft מתחילה Rollout הדרגתי של Passkeys כברירת מחדל להתחברות — בדוק Rollout status בטננט (Entra News / Message Center)','הכן Communication plan למשתמשים: רישום Passkey (Authenticator app / Windows Hello / Security key) לפני שה-Default משתנה עליהם','מטרה: הפחתת תלות ב-SMS/Voice (Phishable methods) — עדכן Authentication strengths (p1-authstrength) בהתאם']}},
  {id:'p1-b2b',pillar:'p1',title:'External Identities Governance (B2B) מוגדר',priority:'medium',phase:4,governance:true,
   guide:{portal:'Entra Admin Center',steps:['External Identities → External collaboration settings → הגבל Guest invite permissions (Members/Admins בלבד)','Cross-tenant access settings → הגדר Inbound/Outbound Trust לפי ארגון שותף','Access reviews → הפעל סקירה תקופתית לחשבונות Guest','B2B direct connect: הגבל ל-Organizations מאושרים בלבד']}},
  {id:'p1-au',pillar:'p1',title:'Administrative Units (AU) מוגדרות — Multi-Country/BU',priority:'medium',phase:4,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Identity → Roles & admins → Administrative units → + Add','הגדר AU לפי Country/Region/Business Unit → הוסף Users, Groups, Devices רלוונטיים','הקצה Scoped role (למשל Helpdesk Administrator) בתוך ה-AU בלבד — לא Global scope','Dynamic membership: שקול AU דינמי לפי Attribute (Country=IL) לעדכון אוטומטי — קריטי לארגונים Multi-Country','⚠️ Deadline 3.11.2026: אם ה-Dynamic AU משתמש ב-MemberOf operator — Microsoft מפסיקה תמיכה, חובה להחליף ל-Attribute-based rule לפני התאריך']}},
  {id:'p1-tenantgov',pillar:'p1',title:'Microsoft Entra Tenant Governance — Shadow Tenants + Configuration Drift',priority:'high',phase:4,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Identity Governance → Tenant governance → Related tenants discovery → הפעל (GA מ-10.8.2026)','סקור Shadow IT tenants שזוהו אוטומטית (B2B sign-ins, Multitenant app consents, Shared billing)','Configuration baseline: הגדר Desired-state JSON (עד 200+ Resource types: CA policies, Exchange transport rules ועוד) על פני Entra/Intune/Exchange/Teams/Purview/Defender','Drift reports: כל 6 שעות — סקור שבועי ותעדף Remediation לפי חומרת הסטייה']}},
  {id:'p1-secadmin-delegate',pillar:'p1',title:'Security Administrator מורחב — תגובה מהירה ללא Global Admin',priority:'medium',phase:1,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Roles & admins → Security Administrator → בדוק היקף הרשאות מורחב (GA מ-9/2026): Disable/Enable user, Revoke sessions, Force password reset','הקצה את התפקיד לצוות SOC/Tier-1 שצריך לחסום חשבון בזמן Incident — בלי להעניק Global Admin','ודא PIM מופעל גם לתפקיד הזה (Eligible, לא Permanent)','תרגל: זמן תגובה מ-Incident detection ועד Account disable בפועל']}},
  {id:'p2-enroll',pillar:'p2',title:'100% מהמכשירים enrolled ב-Intune',priority:'critical',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Enrollment → Windows: Auto-enrollment דרך Entra ID Join','קיימים: Devices → All devices → Export → בדוק מה Unmanaged','Bulk enrollment: Provisioning package / Co-management (MECM)','Monitor: Devices → Monitor → Enrollment failures']}},
  {id:'p2-compliance',pillar:'p2',title:'Compliance Policies מוגדרות לכל Platform',priority:'high',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Compliance policies → Create policy לכל Platform','Windows: BitLocker=Required, Min OS version, Firewall=Required, Antivirus=Required','iOS/Android: PIN=Required, Jailbreak=Block, Min OS version','macOS: FileVault=Required, Firewall=Required, Password=Required']}},
  {id:'p2-block',pillar:'p2',title:'Non-compliant → Block access ל-CA',priority:'high',phase:2,
   guide:{portal:'Entra Admin Center',steps:['Conditional Access → New Policy → Grant: Require compliant device','Compliance policy → Actions for non-compliance → Mark device non-compliant (15 min grace)','Action 2: Send email notification לMDM enrollment','Action 3 (optional): Retire device לאחר 30 יום']}},
  {id:'p2-autopilot',pillar:'p2',title:'Autopilot מוגדר למכשירים חדשים',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Enrollment → Windows Autopilot → Import CSV (Hardware hash)','Device association (GA 8/2026): שייך מכשיר לטננט לפני ה-Enrollment עצמו — בונה אמון מוקדם יותר בתהליך ה-Onboarding','Deployment Profiles → Create → User-driven OR Self-deploying','Enrollment Status Page → Create → Block until all apps configured','ספק: בקש hardware hash CSV בעת כל רכישת מכשיר חדש']}},
  {id:'p2-updates',pillar:'p2',title:'Windows Update / Autopatch מוגדר',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Windows → Update rings → Create Update Ring','Quality updates: defer 5 days | Feature updates: defer 30 days | Deadline: 7 days','Autopatch (E3+): portal.azure.com → Autopatch → Tenant enrollment','Reports → Windows updates → בדוק עדכון compliance']}},
  {id:'p2-analytics',pillar:'p2',title:'Endpoint Analytics מופעל',priority:'low',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Reports → Endpoint analytics → Start → Choose: Intune enrolled devices','בדוק: Startup performance score (מטרה: > 50)','App reliability score: זהה apps קורסים → פנה ל-App team','השווה ל-Baseline ממוצע ארגוני']}},
  {id:'p2-encrypt',pillar:'p2',title:'BitLocker/FileVault מופעל + escrow ל-Intune',priority:'high',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Configuration profiles → New → Endpoint protection → BitLocker','Silent encryption: Require | Store recovery key: Entra ID = Yes','macOS: FileVault → Enable + Personal recovery key escrow to Intune','Monitor: Devices → Monitor → Encryption report']}},
  {id:'p2-noadmin',pillar:'p2',title:'Local Admin הוסר מ-Standard Users',priority:'high',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Windows LAPS: Devices → Windows → LAPS → Enable','Configuration profiles → Settings catalog → Local Users and Groups','Remove: Domain Users / Domain Admins מ-Administrators group','חלופה מתקדמת: Endpoint Privilege Management (EPM) להרמת הרשאות ספציפית']}},
  {id:'p2-mam',pillar:'p2',title:'iOS/Android MAM מוגדר ל-BYOD',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Apps → App protection policies → Create → iOS ואחר כך Android','Target apps: Microsoft Office (Outlook, Teams, OneDrive, Edge)','Settings: PIN=Required, Copy/paste to unmanaged=Block, Backup=Block','CA Policy: Require app protection policy ל-iOS/Android users']}},
  {id:'p2-baselines',pillar:'p2',title:'Microsoft Security Baselines מוחלות',priority:'high',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Endpoint security → Security baselines → בחר Baseline (Windows 11, MDE, Defender for Endpoint) → Create profile','סקור Recommended settings מול Custom (תעד חריגות עם נימוק עסקי)','פרוס ל-Ring ראשון (Pilot) → נטר Conflicts מול פרופילים אחרים','Version updates: כשיוצא Baseline חדש → Compare & merge']}},
  {id:'p2-settingscatalog',pillar:'p2',title:'Settings Catalog מנוהל (במקום ADMX ישנים)',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Configuration → Create → Settings catalog (מחליף בהדרגה Administrative Templates)','בדוק Administrative Templates קיימים → Migrate ל-Settings catalog לפי Microsoft roadmap','Duplicate detection: ודא אין קונפליקטים בין פרופילים שונים','Reports → Configuration profiles → נטר Error/Conflict status']}},
  {id:'p2-appprotection-eff',pillar:'p2',title:'App Protection Effectiveness נמדד',priority:'low',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Apps → Monitor → App protection status → בדוק Sync status לכל Policy','Reports → App protection report → זהה Devices שלא Sync-ו לאחרונה','Threshold: Sync frequency > 30 יום ייחשב Stale','תקן מכשירים Stale (Re-enroll / הודעה למשתמש)']}},
  {id:'p2-remotehelp',pillar:'p2',title:'Remote Help מוגדר',priority:'low',phase:2,
   guide:{portal:'intune.microsoft.com + Entra',steps:['Tenant administration → Connectors and tokens → Remote help → Enable','RBAC: הגדר תפקיד Helpdesk Operator עם הרשאת Remote control בלבד','Entra: ודא Assign roles ממוקד (לא Global Admin לצוות Helpdesk)','בדוק Session logs: Remote help → Reports']}},
  {id:'p2-devicecleanup',pillar:'p2',title:'Device Cleanup Rules מוגדרות',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Devices → Device clean-up rules → Configure','Delete devices that haven\'t checked in for X days (מומלץ 90-180 יום)','לפני הפעלה: Devices → Filter Last check-in > 90 days → סקור ידנית פעם ראשונה','Autopilot devices: ודא Exclusion אם עדיין לא Enrolled בפועל']}},
  {id:'p2-rbac',pillar:'p2',title:'Intune RBAC (Scope Tags + Role Assignments) מוגדר',priority:'high',phase:2,governance:true,
   guide:{portal:'intune.microsoft.com',steps:['Tenant administration → Roles → Scope (Tags) → Create → לפי Business unit / Region','Roles → Assign built-in roles (Policy and Profile Manager, Helpdesk Operator) לפי צוות','הימנע מ-Global Admin לצוות Intune היומיומי','בדוק: Roles → Assignments → סקור כל 6 חודשים']}},
  {id:'p2-epm',pillar:'p2',title:'Endpoint Privilege Management (EPM) מופעל',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Decision point לא Foundation: בדוק קודם אם קיים כבר PAM צד שלישי (CyberArk EPM, BeyondTrust, Delinea, Avecto) — אל תכפיל','אם אין פתרון קיים: Endpoint security → Endpoint Privilege Management → Policies → Create policy','Elevation settings: Default = Deny all / Support approved (לא Automatic בשלב ראשון)','Elevation rules: הגדר אפליקציות ספציפיות שמורשות ל-Elevation (MSI מאושרים)','Reports → Endpoint Privilege Management → נטר בקשות Elevation ואשר/דחה — כלול חינם ב-E5 מ-1.7.2026']}},
  {id:'p2-enterpriseapp',pillar:'p2',title:'Enterprise Application Management מוגדר',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Apps → Enterprise App Catalog → הפעל את היכולת (כלול חינם ב-E5 מ-1.7.2026)','דפדף בקטלוג המנוהל של מיקרוסופט → הוסף אפליקציות ארגוניות ישירות ל-Intune ללא Packaging ידני','הגדר Auto-update לאפליקציות מהקטלוג','Reports → App install status → נטר הצלחת פריסה']}},
  {id:'p2-cloudpki',pillar:'p2',title:'Microsoft Cloud PKI מוגדר',priority:'medium',phase:2,
   guide:{portal:'intune.microsoft.com',steps:['Tenant administration → Cloud PKI → Certificate Authority → Create (Root/Issuing CA)','הגדר SCEP/PKCS Certificate profile דרך Cloud PKI (ללא צורך ב-NDES/CA On-prem)','פרוס ל-Windows Hello for Business certificate-based, Wi-Fi ו-VPN authentication','Monitor → Certificate lifecycle → נטר תפוגה ו-Revocation — כלול חינם ב-E5 מ-1.7.2026']}},
  {id:'p3-mde',pillar:'p3',title:'MDE P2 מחובר לכל מכשיר (Windows + Mac + Linux)',priority:'critical',phase:2,
   guide:{portal:'security.microsoft.com',steps:['Settings → Endpoints → Device management → Onboarding','Windows: Intune → Endpoint security → EDR policy → Onboard via MEM','macOS/Linux: הורד Onboarding package → Deploy via Intune / script','בדוק: Assets → Devices → כל מכשיר בסטטוס Active (Onboarded)']}},
  {id:'p3-tamper',pillar:'p3',title:'Tamper Protection מופעל',priority:'critical',phase:2,
   guide:{portal:'Intune + security.microsoft.com',steps:['Intune: Endpoint security → Antivirus → Windows Defender Antivirus → Tamper Protection: Enable','security.microsoft.com: Settings → Endpoints → Advanced features → Tamper protection: On','לא ניתן לכבות ידנית על Endpoint לאחר הפעלה','בדוק: Device page → Security policies → Tamper protection: On']}},
  {id:'p3-attackdisruption',pillar:'p3',title:'Automatic Attack Disruption מופעל ומכוון',priority:'critical',phase:2,
   guide:{portal:'security.microsoft.com',steps:['מובנה ופעיל כברירת מחדל ב-XDR — Settings → Endpoints → Advanced features → ודא לא הושבת בטעות','מנגנון: מזהה Human-operated attack ברמת ה-Incident ומכיל אוטומטית Device/User/IP מעורבים (לא רק Alert בודד)','Automatic device isolation (Preview מ-5/2026): חוסם רוב התעבורה תוך שמירת קישוריות ל-MDE Services — בדוק אם מופעל בטננט','תרגל: סקור Action center → History לוודא שה-Containment לא פוגע ב-Business-critical services בטעות']}},
  {id:'p3-asr',pillar:'p3',title:'ASR Rules על Block Mode (אחרי Audit)',priority:'high',phase:3,
   guide:{portal:'Intune',steps:['Endpoint security → Attack surface reduction → Create policy → ASR Rules','שלב 1: כל Rules = Audit mode → נטר 2 שבועות ב-security.microsoft.com','שלב 2: Rules ללא FP → Block mode | Rules עם FP → Warn mode','כלל חובה ב-Block: Block credential stealing from LSASS + Block Office macros']}},
  {id:'p3-cfa',pillar:'p3',title:'Controlled Folder Access מופעל',priority:'high',phase:3,
   guide:{portal:'Intune',steps:['Endpoint security → Attack surface reduction → New policy → Controlled folder access','שלב 1: Audit mode → security.microsoft.com → Reports → Protection → בדוק FP','הוסף Allowed apps שנחסמו בטעות (גיבוי, עריכת PDF וכו\')','שלב 2: Block mode לאחר אישור ≈ שבועיים']}},
  {id:'p3-netprot',pillar:'p3',title:'Network Protection מופעל',priority:'high',phase:3,
   guide:{portal:'Intune',steps:['Endpoint security → Attack surface reduction → Network protection: Block','חוסם גישה ל-URLs זדוניים גם מחוץ לדפדפן (C2 traffic)','security.microsoft.com → Reports → Web protection → בדוק Blocks','Web content filtering: הוסף Categories לחסימה (Adult, Gambling וכו\')']}},
  {id:'p3-tvm',pillar:'p3',title:'TVM — Exposure Score מכוסה שבועי',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Vulnerability management → Dashboard → בדוק Exposure score (מטרה: < 30)','Security recommendations → Sort by Exposure score → Top 10','יצור Remediation request → Assign לTeam Member עם Due date','הגדר סקירה שבועית קבועה ביומן']}},
  {id:'p3-air',pillar:'p3',title:'AIR — Automated Remediation מאושר',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Settings → Endpoints → Device groups → Edit groups','Automation level: Full - remediate threats automatically (לארגון בשל)','Action center → Automated investigations → בדוק שאין Blocked actions','Pending actions → Approve / Reject investigations שממתינות']}},
  {id:'p3-live',pillar:'p3',title:'Live Response — מופעל לצוות SOC',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Settings → Endpoints → Advanced features → Live response: On','Live response for servers: On (אם יש Servers)','Assets → Devices → בחר מכשיר → Initiate Live Response session','הכשר SOC: getfile, putfile, run, findfile, remediate']}},
  {id:'p3-sensors',pillar:'p3',title:'MDI Sensors על כל Domain Controllers',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Settings → Identities → Sensors → בדוק שכל DC מופיע ברשימה','סטטוס חייב להיות: Running (לא Stopped / Error / Update pending)','Sensor שלא מגיב: Restart MDI Sensor service על ה-DC','גרסאות: Sensors מתעדכנים אוטומטית (וודא Auto-update מופעל)']}},
  {id:'p3-discovery',pillar:'p3',title:'Device Discovery מופעל (מכשירים לא מנוהלים)',priority:'high',phase:2,
   guide:{portal:'security.microsoft.com',steps:['Settings → Endpoints → Device discovery → Discovery setup → Standard mode (Active probing)','בדוק: Device inventory → Filter Onboarding status = "Can be onboarded"/"Insufficient info"','Onboard מכשירים שהתגלו (Servers, IoT, Legacy) לפי סדר עדיפות','Basic mode אם רגישות רשת גבוהה (Passive בלבד)']}},
  {id:'p3-vulnremediate',pillar:'p3',title:'Vulnerability Remediation Workflow פעיל',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Vulnerability management → Recommendations → בחר CVE קריטי → Request remediation','Remediation → אינטגרציית Intune → Auto-create Remediation task','Track: Remediation → Activities → נטר Status (Pending/In progress/Completed)','SLA: הגדר יעד תיקון לפי חומרה (Critical: 7 ימים, High: 30 ימים)']}},
  {id:'p3-exposure',pillar:'p3',title:'Exposure Management (Attack Surface + Critical Assets)',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Exposure management → Overview → בדוק Exposure score מגמתי','Attack surface → Critical asset management → תייג Assets קריטיים (DC, Servers פיננסיים)','Initiatives → הפעל Initiative רלוונטי (Ransomware, Identity security posture)','Attack paths → סקור Attack path visualization → תעדף תיקון']}},
  {id:'p3-exposure-closure',pillar:'p3',title:'Exposure Management — % המלצות שנסגרו נמדד',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Exposure management → Recommendations → סנן לפי Status (Open/In Progress/Completed)','חשב % סגירה: Completed / Total recommendations — עקוב לאורך זמן, לא Snapshot בודד','הגדר יעד ריאלי (למשל 70% תוך רבעון) ותעדף לפי Exposure score impact','דוח חודשי: מגמת סגירה + Recommendations שנפתחו מחדש (Regression)']}},
  {id:'p3-edrblock',pillar:'p3',title:'EDR in Block Mode מופעל (כש-AV צד שלישי הוא Primary)',priority:'high',phase:2,
   guide:{portal:'Intune + security.microsoft.com',steps:['תרחיש: AV צד שלישי כ-Primary + MDE ב-Passive mode','Intune: Endpoint security → Antivirus → EDR policy → EDR in block mode: Enable','מטרה: MDE חוסם Post-breach גם כש-Passive (Backup detection)','בדוק: Device page → Onboarding status = Passive + EDR block mode = On']}},
  {id:'p3-hunting',pillar:'p3',title:'Advanced Hunting (KQL) בשימוש שוטף',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Hunting → Advanced hunting → צור Custom detection rule מ-Query שימושי','Query library → שמור Queries חוזרים (Lateral movement, Credential dumping)','Custom detections → הגדר Alert + Action (Isolate device) אוטומטי','הרץ שבועי מתוכנן → תעד ממצאים']}},
  {id:'p3-isolation',pillar:'p3',title:'Device Isolation Playbook מוגדר',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['תעד תהליך: Device page → Actions → Isolate device (Full / Selective)','Selective isolation: אפשר Outlook/Teams להישאר פעילים בזמן חקירה','Automation rule: Isolate אוטומטית ב-Incident Severity=Critical + Confidence=High','Selective Response Actions (חדש): הגדר בקרה עדינה יותר ל-Tier-0 assets (DC, PKI servers) — לא כל Response action מותר עליהם אוטומטית','תרגל Tabletop: מדוד זמן תגובה מ-Alert ועד Isolation']}},
  {id:'p3-indicators',pillar:'p3',title:'Indicator Management (IOCs) מנוהל',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Settings → Endpoints → Indicators → File hashes / IP addresses / URLs-Domains → Add','ייבוא Threat Intel feed חיצוני (STIX/TAXII) אם קיים','Certificate indicators: חסום Publishers ידועים כזדוניים','בדוק: Indicators → נטר Expiry dates (ברירת מחדל 30-180 יום)']}},
  {id:'p3-threatexperts',pillar:'p3',title:'Microsoft Defender Experts מוגדר (Add-on, אם רלוונטי)',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Settings → Endpoints → Advanced features → Defender Experts for Hunting: On (אם נרכש כתוסף)','Defender Experts for XDR: בדוק אם יש Managed SOC פעיל','Defender Experts MDR P2 (חדש, 8/2026): מכסה גם מקורות שאינם Microsoft — AWS, Okta, Proofpoint, Palo Alto, Cisco, Fortinet, Zscaler, CrowdStrike דרך Sentinel','Escalations: הגדר Contact ל-Expert-driven investigations · SLA: תעד זמני תגובה מוסכמים עם ה-Vendor']}},
  {id:'p3-devicecontrol',pillar:'p3',title:'Device Control — הגבלת גישה ל-Removable Storage (USB)',priority:'high',phase:2,
   guide:{portal:'Intune + security.microsoft.com',steps:['Intune תומך כעת ישירות ב-Removable storage access control (חדש) — Endpoint security → Attack surface reduction → Device control policy','הגדר: Block / Read-only / Allow לפי Device class (USB, Removable media) ולפי קבוצת משתמשים','Exceptions: הגדר USB devices מאושרים לפי Hardware ID (למשל דיסק גיבוי ארגוני)','בדוק: security.microsoft.com → Reports → Device control → נטר ניסיונות חסומים']}},
  {id:'p4-safelinks',pillar:'p4',title:'Safe Links — כל users',priority:'critical',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Policies & rules → Threat policies → Safe Links','Create new policy → Scope: All users (לא רק default policy)','Enable: Real-time URL scanning + Rewrite URLs + Track clicks','Enable: Apply Safe Links to Teams messages + Office desktop apps']}},
  {id:'p4-safeatt',pillar:'p4',title:'Safe Attachments — כל users + SharePoint',priority:'critical',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Threat policies → Safe Attachments → Global settings → Enable for SharePoint/OneDrive/Teams','Create policy → Action: Block → Scope: All users','Redirect malicious attachments: הגדר mailbox לצוות Security','בדוק: Explorer → Malware view → Safe Attachments detections']}},
  {id:'p4-antiphish',pillar:'p4',title:'Anti-Phishing — Impersonation VIP מוגדר',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Threat policies → Anti-phishing → Edit default policy (או Create new)','Impersonation tab → Add protected users: CEO, CFO, IT Director, Board members','Protected domains: הוסף domain ארגוני + partner domains','Advanced phishing thresholds: 3 (Aggressive) לסביבת Enterprise']}},
  {id:'p4-zap',pillar:'p4',title:'ZAP (Zero-hour Auto Purge) מופעל',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Threat policies → Anti-malware → בדוק שZAP מופעל (On by default)','Anti-spam policy → Spam ZAP: On | Phish ZAP: On','Threat Explorer → Delivery action: ZAP → אמת שZAP פועל','אם ZAP כבוי: Edit policy → Zero-hour auto purge (ZAP): Enable']}},
  {id:'p4-dmarc',pillar:'p4',title:'DKIM + DMARC + SPF מוגדרים',priority:'critical',phase:1,
   guide:{portal:'security.microsoft.com + DNS',steps:['DKIM: Email & collaboration → Policies → DKIM → Enable לכל Domain (2 CNAME records)','SPF (DNS TXT): "v=spf1 include:spf.protection.outlook.com -all"','DMARC (DNS TXT): "v=DMARC1; p=quarantine; rua=mailto:dmarc@domain.com"','אמות: MXToolbox.com → DMARC/DKIM/SPF lookup']}},
  {id:'p4-sim',pillar:'p4',title:'Attack Simulator — Simulation ראשון בוצע',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Attack simulation training → Simulations','+ Launch Simulation → בחר Spear phishing (credentials) → Next','בחר Payload: Microsoft account login (מוכן מראש)','Target: All users → Run immediately → Launch','בדוק תוצאות לאחר 72 שעות: Simulations → ה-Simulation → ראה Click rate']}},
  {id:'p4-training',pillar:'p4',title:'Training מוגדר אוטומטית לנופלים',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Attack simulation training → Settings → Simulation notifications','Positive reinforcement notification: Enable','Training assignment: בחר "Assign training automatically"','Training threshold: Assign to users who clicked phishing link','בדוק Training completion rates ב-Reports → Simulation coverage']}},
  {id:'p4-explorer',pillar:'p4',title:'Threat Explorer — Analyst מכיר ועובד',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Explorer → בחר "All email"','הדגם queries: Sender domain, Subject, Detection tech','סינון לפי: Malware / Phish / Spam / None','Action: Email message actions → Soft/Hard delete לפי צורך','ייצא ל-CSV לדו"ח שבועי: Export → Download']}},
  {id:'p4-preset',pillar:'p4',title:'Preset Security Policies (Standard/Strict) + Priority Accounts מוגדרות',priority:'high',phase:1,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Threat policies → Preset security policies','Standard protection → Apply → הקצה לכלל הארגון (Manage protection → Users/domains)','Strict protection → Apply → הקצה ל-Priority accounts + Executives/Finance/HR','Settings → Priority accounts → תייג את כל ה-C-Level ובעלי גישה רגישה — Strict מגן עליהם באגרסיביות גבוהה יותר']}},
  {id:'p4-tenantallowblock',pillar:'p4',title:'Tenant Allow/Block List מנוהל',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Threat policies → Tenant Allow/Block Lists','URLs / Domains / Files / Sender addresses → נהל חריגות שאושרו ידנית','בדוק תוקף אוטומטי (ברירת מחדל 30-90 יום) → חדש לפי צורך','Submissions → אישור False positive → הוסף אוטומטית ל-Allow list']}},
  {id:'p4-userreported',pillar:'p4',title:'User Reported Message Settings מוגדרות',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Threat policies → User reported settings','הפעל Report button ב-Outlook (Report Message / Report Phishing add-in)','הגדר יעד: Send reported messages to → Microsoft + Custom mailbox (SecOps)','Notification: שלח אישור חזרה למשתמש שדיווח']}},
  {id:'p4-campaign',pillar:'p4',title:'Campaign Views נסקרות',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Campaigns → סקור קמפייני Phishing/Malware שזוהו אוטומטית נגד הארגון','זהה תבניות תקיפה חוזרות → תעד Threat actor patterns','שתף ממצאים עם צוות Threat Intelligence','ייצוא לדוח חודשי']}},
  {id:'p4-air',pillar:'p4',title:'AIR ל-Email (Automated Investigation & Response) פעיל',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Explorer → Email entity page → בדוק AIR investigations שנוצרו אוטומטית מ-Alerts','Action center → Investigations → Pending actions → Approve/Reject','כוונן Alert policies שמפעילות AIR (Phish click, Malware delivery)','מדוד: זמן ממוצע מ-Alert ועד Auto-remediation']}},
  {id:'p4-threattrackers',pillar:'p4',title:'Threat Trackers נסקרים',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Threat tracker → Noteworthy trackers → סקור מגמות איומים גלובליות רלוונטיות לתעשייה','Tracked queries: שמור Query מותאם לניטור שוטף','שילוב עם Campaign views לזיהוי מוקדם']}},
  {id:'p4-submission',pillar:'p4',title:'Submission Policies מוגדרות',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Email & collaboration → Submissions → Admin submissions → Add (דגימות ל-Microsoft לניתוח)','Submission policies: הגדר Auto-forwarding rules לחשבון Submissions מרכזי','Results: בדוק Verdict חוזר תוך 24-48 שעות','שלב תהליך: False negative/positive מ-SOC → Submit אוטומטי']}},
  {id:'p4-secops-mailbox',pillar:'p4',title:'SecOps Mailbox מוגדר (Dedicated Security Mailbox)',priority:'medium',phase:1,
   guide:{portal:'Exchange Admin Center + security.microsoft.com',steps:['צור Mailbox ייעודי: secops@[domain] (לא תיבה אישית)','הגדר Exclusion מ-Preset Security policies (למניעת Quarantine של דגימות Malware מכוונות)','Permissions: גישה מוגבלת לצוות SOC בלבד + Audit logging','חבר כ-Destination ל-User reported messages + Submissions']}},
  {id:'p5-shadow',pillar:'p5',title:'Shadow IT Discovery מופעל (MDE Integration)',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com + admin.microsoft.com',steps:['Defender for Endpoint → Settings → Advanced features → Microsoft Defender for Cloud Apps: On','security.microsoft.com → Cloud apps → Cloud app catalog → בדוק Discovered apps','Defender portal → Settings → Cloud Apps → Microsoft Defender for Endpoint → Enable','בדוק Cloud Discovery reports: Cloud apps → Cloud Discovery → Dashboard','סנן לפי Risk score < 5 → שקול לחסום apps מסוכנות']}},
  {id:'p5-sanction',pillar:'p5',title:'Sanctioned / Unsanctioned Apps מסומנות',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Cloud app catalog → מצא App','לחץ על ה-App → Tag as: Sanctioned / Unsanctioned','Unsanctioned apps → Create Block script (MDE): Generate Block script','Sanctioned apps → ניתן ליצור App connector (אם יש API)','בדוק רשימה ב: Cloud apps → Connected apps']}},
  {id:'p5-session',pillar:'p5',title:'MDCA Session Controls על ה-Apps הרגישים',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com + Entra',steps:['Entra Admin Center → CA Policy → New Policy','Cloud apps: בחר SharePoint Online + Exchange Online','Session: Use Conditional Access App Control → Custom policy','MDCA → Policies → Session policy → + Create policy','Action: Block download (on unmanaged devices) | Require step-up auth']}},
  {id:'p5-block-dl',pillar:'p5',title:'Block Download על BYOD Devices',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['MDCA → Policies → Session policy → + Create','Policy template: Block download based on real-time content inspection','Filter: Device management = Not domain joined AND Not compliant','App: בחר SharePoint, OneDrive, Exchange','Action: Block download → הפעל ב-Monitor תחילה → לאחר 7 ימים Block']}},
  {id:'p5-oauth',pillar:'p5',title:'OAuth App Governance מוגדר',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → App governance → Overview','בדוק Apps with high privilege that are not commonly used','Unused app insights (GA 8/2026): App governance → Insights → זהה OAuth apps מחוברים שלא נעשה בהם שימוש → Revoke','Policies → + Create policy → App policy → Over-privileged app','Alert on: New app with high permissions (Mail.ReadWrite, Files.ReadWrite.All) → Remediation: Disable app → הודע ל-user → חקור']}},
  {id:'p5-anomaly',pillar:'p5',title:'Anomaly Detection Policies מופעלות',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Policies → Policy management → סנן: Anomaly detection','ודא שכל ה-Built-in policies מופעלות (Impossible travel, Mass download, etc.)','Tune sensitivity: לחץ על Policy → Edit → Sensitivity slider','Scope: Apply to All users (לא Specific groups)','Alerts → בדוק שבועי: Cloud apps → Alerts → Filter: Anomaly detection']}},
  {id:'p5-connectors',pillar:'p5',title:'App Connectors (API-based) מחוברים',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Connected apps → App connectors → Connect app (Salesforce, Box, ServiceNow, GitHub, AWS, Google Workspace לפי מה שקיים בארגון)','לכל App: הגדר Scan scope (Files, Users, Activities)','בדוק: Connected apps → Status = Connected (ירוק) + Last scan time','הפעל Governance actions אוטומטיות (Quarantine, Remove external share)']}},
  {id:'p5-govactions',pillar:'p5',title:'Governance Actions אוטומטיות מוגדרות',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Files → Governance log → סקור פעולות שבוצעו אוטומטית','Policies → File policy → Governance actions: Remove external collaborators / Apply label / Quarantine','Unified RBAC (Auto-enabled ללקוחות חדשים מ-8/2026): Settings → Permissions → Roles → ודא הרשאות MDCA מנוהלות דרך Defender Unified RBAC ולא הרשאות נפרדות','בדוק Governance log → Filter: Failed actions → תקן הרשאות Connector']}},
  {id:'p5-filepolicy',pillar:'p5',title:'File Policies מוגדרות',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Control → Policies → Create policy → File policy','Filter: Sharing = "Public"/"External" + Content contains sensitivity label','Action: Notify + Apply classification label + Restrict access','Scope: SharePoint, OneDrive, Box, Google Drive (App connectors מחוברים)']}},
  {id:'p5-activitypolicy',pillar:'p5',title:'Activity Policies מוגדרות',priority:'medium',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Control → Policies → Create policy → Activity policy','Template: Mass download by single user, Multiple failed login attempts','Action: Suspend user + Require step-up MFA','בדוק Alerts → Activity policy matches שבועי']}},
  {id:'p5-impossibletravel',pillar:'p5',title:'Impossible Travel Detection מכוונן',priority:'high',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Policies → Anomaly detection policies → Impossible travel','Sensitivity slider: כוונן לפי גודל הארגון (נמוך = פחות False positives)','Exclude: VPN corporate ranges מ-Trusted locations','בדוק Alerts שבועי → Investigate + Tune Exceptions']}},
  {id:'p5-alerttuning',pillar:'p5',title:'MDCA Alert Tuning — תהליך קבוע',priority:'low',phase:3,
   guide:{portal:'security.microsoft.com',steps:['Cloud apps → Alerts → סקור שבועי: Open vs Dismissed vs Resolved','זהה Policies עם False positive rate גבוה → Adjust sensitivity/Scope','תעד Baseline "normal behavior" לארגון (בעיקר ב-3 חודשים הראשונים)','הגדר Owner לכל קטגוריית Policy']}},
  {id:'p6-labels',pillar:'p6',title:'Sensitivity Labels מפורסמות לכל הארגון',priority:'high',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Information protection → Labels → + Create a label','צור היררכיה: Public → Internal → Confidential → Highly Confidential','לכל Label: הגדר encryption, content marking (header/footer/watermark)','Label policies → + Publish label → בחר את כל ה-Labels','Publish to: All users and groups → Default label: Internal']}},
  {id:'p6-autolabel',pillar:'p6',title:'Auto-Labeling Policy מוגדרת',priority:'medium',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Information protection → Auto-labeling → + Create auto-labeling policy','Choose info to label: Credit card numbers / National ID / etc.','Locations: SharePoint, OneDrive, Exchange','Simulation mode: Run simulation → בדוק תוצאות','לאחר אישור: Turn on policy → Enforce']}},
  {id:'p6-dlp',pillar:'p6',title:'DLP Policies — Audit ואחר כך Enforce',priority:'high',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Data loss prevention → Policies → + Create policy','Template: Israel Financial Data / PCI DSS / Custom','Locations: Teams, Exchange, SharePoint, OneDrive, Endpoint','Mode: Test mode with notifications (2 שבועות) → לאחר מכן Enforce','Block + Allow override with business justification + require Incident report']}},
  {id:'p6-edlp',pillar:'p6',title:'Endpoint DLP מופעל',priority:'high',phase:5,
   guide:{portal:'compliance.microsoft.com + Intune',steps:['compliance.microsoft.com → Data loss prevention → Endpoint DLP settings','Onboarding: ודא שמכשירים מחוברים דרך Intune / MDE','DLP Policy → Locations → הוסף Endpoint devices','Actions: Audit / Block / Block with override לפי רגישות','בדוק: DLP → Activity explorer → Filter: Endpoint activities']}},
  {id:'p6-irm',pillar:'p6',title:'Insider Risk Management — 3+ Policies',priority:'medium',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Insider risk management → Policies → + Create policy','Policy 1: Data theft by departing users (חיבור ל-HR Connector)','Policy 2: Data leaks — General data leaks','Policy 3: Security policy violations by users (חיבור ל-MDE)','Indicators: הפעל File exfiltration, Email forwarding, USB upload']}},
  {id:'p6-hr',pillar:'p6',title:'HR Connector מחובר (עזיבה / גיוס)',priority:'medium',phase:5,governance:true,
   guide:{portal:'compliance.microsoft.com',steps:['Data connectors → HR → + Add','Set up connector: הורד script Python → הכנס API key','CSV format: EmailAddress, ResignationDate, LastWorkingDate','הגדר scheduled task (Task Scheduler) להריץ script מדי יום','IRM → בדוק שנתוני HR מגיעים: Insider risk → Users → HR data']}},
  {id:'p6-compl',pillar:'p6',title:'Communication Compliance — לפי רגולציה',priority:'low',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Communication compliance → Policies → + Create policy','Policy type: Detect inappropriate content / Regulatory compliance','Scope: בחר groups רלוונטיים (Finance, Legal, Executives)','Classifiers: Regulatory collusion, Targeted harassment, Profanity','Reviewers: הגדר compliance officers → Alerts on match']}},
  {id:'p6-audit',pillar:'p6',title:'Audit Premium — 180 יום retention',priority:'high',phase:5,governance:true,
   guide:{portal:'compliance.microsoft.com',steps:['Audit → Audit retention policies → + New retention policy','Name: Audit-Premium-180days | Duration: 180 days','Record type: All (או לפי צורך: AzureActiveDirectory, Exchange, SharePoint)','Priority: 1 (גבוה יותר = גובר על default)','ודא E5/E5 Compliance license מוקצה ל-users הרלוונטיים']}},
  {id:'p6-retention',pillar:'p6',title:'Retention Policies מוגדרות',priority:'medium',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Data lifecycle management → Retention policies → + New policy','Policy 1: Exchange email — Retain 7 years (רגולציה ישראלית)','Policy 2: SharePoint + OneDrive — Retain 5 years','Policy 3: Teams messages — Retain 3 years','Conflict: Longest wins → בדוק ב: Retention → Policy lookup']}},
  {id:'p6-dlpquarantine',pillar:'p6',title:'DLP File Quarantine (SharePoint/OneDrive) מופעל',priority:'medium',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Data loss prevention → Policies → בחר Policy קיים ל-SharePoint/OneDrive → Edit rule','Actions → הוסף Action: Quarantine file (GA יולי 2026, בנוסף ל-Block הקיים)','הגדר Reviewer group שמאשר שחרור קבצים מ-Quarantine','Activity explorer → סנן DLPRuleMatch עם Action=Quarantine → נטר קצב False Positives']}},
  {id:'p6-retentionlabels',pillar:'p6',title:'Retention Labels (ברמת פריט) מוגדרות ו-Published',priority:'medium',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Data lifecycle management → Labels → Create a label → הגדר Retention period + Action at end of retention (Delete/Review/Keep)','Label policies → Publish → בחר Locations','Auto-apply: הגדר Trainable classifier / Sensitive info type לתיוג אוטומטי','Disposition review: הגדר Reviewers לפני מחיקה סופית']}},
  {id:'p6-records',pillar:'p6',title:'Records Management (רשומות רגולטוריות) מוגדר',priority:'medium',phase:5,governance:true,
   guide:{portal:'compliance.microsoft.com',steps:['Records management → File plan → הגדר קטגוריות רשומות (Regulatory, Business-critical)','Label ל-Record / Regulatory record (immutable, לא ניתן להסרה ידנית)','Disposition: Event-based retention (למשל סיום חוזה) + Manual disposition review','File plan descriptors: Citation, Jurisdiction, Department']}},
  {id:'p6-ediscovery-std',pillar:'p6',title:'eDiscovery (Standard) מוגדר',priority:'medium',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['eDiscovery → Standard → Create case','Search: הגדר Search query (Keywords, Date range, Custodians)','ודא הרשאות (eDiscovery Manager role) מוגדרות נכון','Case closure: תעד תהליך סגירת Case + שמירת ראיות']}},
  {id:'p6-ediscovery-premium',pillar:'p6',title:'eDiscovery Premium + Legal Hold מוגדרים',priority:'high',phase:5,governance:true,
   guide:{portal:'compliance.microsoft.com',steps:['eDiscovery → Premium → Create case → Add custodians','Legal hold: Create hold policy → Custodian notification (Hold notification template)','Review sets: השתמש ב-Analytics (Near-duplicate detection, Email threading)','Chain of custody: תעד Export logs לצורך הליך משפטי']}},
  {id:'p6-datamap',pillar:'p6',title:'Purview Data Map / Unified Catalog מוגדר',priority:'medium',phase:5,
   guide:{portal:'purview.microsoft.com',steps:['Data Map → Sources → Register source (SQL, ADLS, SharePoint, Power BI)','Scan → Create scan rule → Run scan (Full/Incremental)','Classification: בדוק Data assets מסווגים אוטומטית לפי Sensitive info types','Glossary: הגדר Business glossary terms לנתונים קריטיים']}},
  {id:'p6-classanalytics',pillar:'p6',title:'Data Classification Analytics נסקר',priority:'low',phase:5,
   guide:{portal:'compliance.microsoft.com',steps:['Data classification → Overview → סקור Sensitive info types מפוזרים בארגון (Top locations)','Content explorer → זהה Repositories עם ריכוז נתונים רגישים','Activity explorer → נטר פעולות על תוכן מסווג (Copy, Print, Share)','דוח רבעוני: מגמת חשיפה (עולה/יורדת)']}},
  {id:'p6-sam',pillar:'p6',title:'SharePoint Advanced Management — Data Access Governance + Site Access Reviews',priority:'high',phase:5,governance:true,
   guide:{portal:'SharePoint Admin Center',steps:['Advanced management → Data access governance reports → סקור אתרים עם חשיפה רחבה (Everyone/Anyone)','Site access reviews: האצל את בדיקת האתרים החשופים ל-Site owners עצמם — לא רק ל-IT','Catalog management: ארגן אתרים לקטגוריות → scope עליהן Policies ו-Copilot rollout','Enterprise app insights: זהה אפליקציות (לא-Microsoft) הרשומות ב-Entra עם גישה ל-SharePoint content בהיקף גדול','SharePoint Admin Agent (חדש): נסה שאילתה על נתוני Governance דרך ה-Chat interface לפני Remediation ידני']}},
  {id:'p6-adaptive',pillar:'p6',title:'Adaptive Protection (סיכון דינמי + DLP/IRM) מוגדר',priority:'high',phase:5,governance:true,
   guide:{portal:'purview.microsoft.com',steps:['Insider Risk Management → Adaptive protection → Turn on','הגדר Risk levels (Elevated/Moderate/Minor) → שיוך אוטומטי ל-DLP policy מחמירה יותר','Integration: DLP policy scope → Elevated risk users','בדוק: Adaptive protection → Impact report → משתמשים שעברו Risk level']}},
  {id:'p6-losstrends',pillar:'p6',title:'Data Loss Trends נסקרים',priority:'low',phase:5,
   guide:{portal:'purview.microsoft.com',steps:['Data Security Posture Management → Data loss trends (metrics view)','סקור מגמת DLP matches לאורך זמן (עולה = בעיה מחמירה או Policy חדש)','Filter לפי Location/Policy/User group','דוח חודשי למנהל אבטחה']}},
  {id:'p6-riskanalytics',pillar:'p6',title:'Data Risk Analytics (DSPM Recommendations) מיושם',priority:'medium',phase:5,governance:true,
   guide:{portal:'purview.microsoft.com',steps:['Solutions → DSPM (חוויה מאוחדת — DSPM Classic + DSPM for AI Classic נסגרים ב-30.9.2026, כל הנתונים עברו אוטומטית) → Recommendations','סקור Data Risk Assessments ברמת פריט (item-level) — כולל Automated remediation: Bulk disable oversharing links, הפעלת Protection policy ישירות מהדוח','יישם Top 3-5 המלצות לחודש (Overshared files, Missing labels)','מדוד השפעה: Before/After Risk score · שילוב: DSPM Reports → Executive summary ללקוח']}},
  {id:'p6-infobarriers',pillar:'p6',title:'Information Barriers מוגדרות (אם רלוונטי)',priority:'low',phase:5,governance:true,
   guide:{portal:'compliance.microsoft.com',steps:['Information barriers → Segments → הגדר קבוצות לפי Department/Attribute (למשל Investment Banking מול Research)','Policies → Create → Block communication/collaboration בין Segments רלוונטיים','Apply policies → Validate','רלוונטי בעיקר לארגונים עם דרישת הפרדה רגולטורית (פיננסים)']}},
  {id:'p7-workspace',pillar:'p7',title:'Sentinel Workspace מוגדר',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['⚠️ מ-7/2026 Sentinel הוא Defender-portal-only — security.microsoft.com/microsoft-sentinel, לקוחות ב-Azure Portal מנותבים אוטומטית','security.microsoft.com → Microsoft Sentinel → + Create','בחר / צור Log Analytics Workspace (אותו region כמו M365)','Settings → Workspace settings → Daily cap: הגדר cap למניעת עלויות בלתי צפויות','Content hub → Install: Microsoft 365 Defender, Entra ID, Azure Activity','Pricing tier: Pay-as-you-go / Commitment tier / Sentinel Data Lake (חדש) לפי נפח']}},
  {id:'p7-e5conn',pillar:'p7',title:'E5 Connector מחובר (Defender data חינם)',priority:'critical',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Data connectors → "Microsoft Defender XDR"','Connect → Next → Configure → Connect incidents & alerts','Advanced: Sync all MDE, MDO, MDI, MDCA events (חינם לעד 3TB/חודש)','ודא: Data connectors → Status = Connected (ירוק)','Verify: Logs → SecurityAlert | take 10 (אמור להחזיר נתונים)']}},
  {id:'p7-entra',pillar:'p7',title:'Entra ID Connector מחובר',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Data connectors → "Microsoft Entra ID"','Open connector page → Connect','בחר: Sign-in logs, Audit logs, Provisioning logs, Risk events','ודא Diagnostic settings ב-Entra: Users → Diagnostic settings → Send to Log Analytics','Verify: Logs → SigninLogs | take 5']}},
  {id:'p7-m365',pillar:'p7',title:'M365 / Purview Connector מחובר',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Data connectors → "Microsoft 365 (formerly Office 365)"','Open connector → Connect','בחר: Exchange, SharePoint, Teams','Content hub → Install "Microsoft Purview" solution (DLP alerts ל-Sentinel)','Verify: Logs → OfficeActivity | take 5']}},
  {id:'p7-rules',pillar:'p7',title:'Analytics Rules מופעלות (לפחות 20)',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Analytics → Rule templates','סנן: Source = Microsoft (כלול M365 Defender, Entra ID)','בחר לפחות 20 rules → Create rule מכל אחד','חיוניים: Brute force, Impossible travel, MFA fatigue, Lateral movement','Automation rule: כל Incident High → צור Task אוטומטי ל-Tier 1']}},
  {id:'p7-playbook',pillar:'p7',title:'Response Playbook לאירועים High-Severity',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Automation → + Create → Automation rule','Trigger: When incident is created | Severity = High','Action 1: Run playbook → "Notify-SOC-Teams" (Logic App)','Logic App: POST ל-Teams channel עם פרטי ה-Incident','Action 2: Tag incident "SOC-Notified" → Assign to Tier 2']}},
  {id:'p7-ueba',pillar:'p7',title:'UEBA מופעל ב-Sentinel',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Settings → Entity behavior → Entity behavior settings','Turn on: User and Entity Behavior Analytics (UEBA)','Data sources: Microsoft Entra ID + MDE + M365 Defender + (Preview 8/2026) Fortinet, AWS GuardDuty, Check Point, Zscaler','Anomaly rules: Analytics → Rule templates → סנן: Anomaly → Enable top 10','בדוק: Entity behavior → Users → בחר user בעייתי → ראה Insights']}},
  {id:'p7-ti',pillar:'p7',title:'Threat Intelligence Connector מחובר',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Data connectors → "Microsoft Threat Intelligence" (חינם מ-1.8.2026 — MDTI Convergence הושלם, כלול בכל Unified SecOps)','Connect → Open connector page → Connect','Content hub → Install "Threat Intelligence" solution','TI Analytics rules: Enable "TI map IP entity to * logs" rules (5-10 rules)','Sentinel → Threat intelligence → בדוק IOCs מגיעים בזמן אמת']}},
  {id:'p7-hunting',pillar:'p7',title:'Weekly Threat Hunting Session',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Hunting → Queries → סנן: Tactics = Persistence / Exfiltration','בחר 3-5 queries שבועיים → Run All Selected','Bookmark ממצאים חשודים → Investigate','דוגמה KQL שבועי: SigninLogs | where RiskLevelDuringSignIn != "none" | summarize count() by UserPrincipalName','תעד ממצאים ב-Sentinel Workbooks → Hunting workbook']}},
  {id:'p7-review',pillar:'p7',title:'Monthly Security Review + Secure Score',priority:'low',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Secure Score → ראה Score + השוואה ל-חודש קודם','Recommended actions → מיין לפי: Points achieved (הקל ביותר ראשון)','בחר 3-5 המלצות לביצוע החודש → הקצה ל-engineer','Sentinel → Workbooks → Security Operations Efficiency → ייצא דו"ח','שלח Executive Summary: Score, Incidents handled, Open blockers']}},
  {id:'p7-pentest',pillar:'p7',title:'Quarterly Penetration Testing',priority:'low',phase:6,
   guide:{portal:'external',steps:['הכן Scope document: IP ranges, domains, cloud assets','בחר penetration testing vendor (מאושר ע"י הנהלה)','Assumed breach test: ניתן להשתמש ב-Attack Simulation training כ-pre-test','בדוק Sentinel alerts מופעלים בזמן הtest (ודא visibility)','קבל דו"ח + patch ממצאים תוך 30 יום | Retest תוך 60 יום']}},
  {id:'p7-tabletop',pillar:'p7',title:'Annual Tabletop Exercise (IR Simulation)',priority:'low',phase:6,
   guide:{portal:'internal',steps:['הכן Scenario: Ransomware / BEC / Data exfiltration (בחר אחד)','משתתפים: IT, Security, Legal, HR, Management','סמלץ: Detection → Containment → Eradication → Recovery → Lessons Learned','תעד: מה עבד טוב, מה נכשל, מה חסר ב-playbook','Update IR Playbook ו-Contact list לאחר התרגיל']}},
  {id:'p7-socmaturity',pillar:'p7',title:'SOC Maturity Assessment מבוצע',priority:'medium',phase:6,governance:true,
   guide:{portal:'security.microsoft.com + Sentinel',steps:['Secure Score + Sentinel Workbooks → Security Operations Efficiency','הערך רמת בשלות SOC (Reactive / Proactive / Predictive) לפי Framework (למשל SOC-CMM)','תעד Gap Analysis מול היעד','תוכנית שיפור רבעונית']}},
  {id:'p7-mitre',pillar:'p7',title:'MITRE ATT&CK Coverage נמדד',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Content hub → MITRE ATT&CK Workbook → Install','סקור Coverage heatmap: אילו Tactics/Techniques מכוסות ע"י Analytics rules קיימים','זהה Gaps (Techniques ללא Detection) → תעדף לפי Threat model רלוונטי','הוסף Analytics rules חדשים לסגירת Gaps קריטיים']}},
  {id:'p7-connectorhealth',pillar:'p7',title:'Connector Health מנוטר',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Data connectors → Connector health monitoring (Workbook מובנה)','הגדר Alert: Data connector הפסיק לשלוח Logs > 24 שעות','KQL: SentinelHealth לניטור סטטוס Connectors','בדוק שבועי: אין Connector ב-Disconnected/Error']}},
  {id:'p7-automationpct',pillar:'p7',title:'Incident Automation % נמדד',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Workbooks → Security Operations Efficiency → Automation rate','מדוד: כמה % מה-Incidents נסגרים/מטופלים אוטומטית ללא מגע אנושי','יעד ריאלי: 30-50% ל-Low/Medium severity','זהה Incident types חוזרים → בנה Automation rule נוספת']}},
  {id:'p7-logsource',pillar:'p7',title:'Log Source Coverage נבדק מול Assets',priority:'high',phase:6,
   guide:{portal:'security.microsoft.com',steps:['השווה רשימת Assets (מ-CMDB/Intune/MDE) מול מקורות Logs מחוברים בפועל','זהה Blind spots (Servers/Apps קריטיים ללא Logging)','תעדוף חיבור לפי קריטיות עסקית','תעד ב-Workbook ייעודי: Coverage Map']}},
  {id:'p7-mssp',pillar:'p7',title:'MSSP Integration מוגדר (אם רלוונטי)',priority:'low',phase:6,
   guide:{portal:'security.microsoft.com',steps:['אם עובדים עם SOC חיצוני: Azure Lighthouse → Delegate resource access ל-MSSP tenant','הגדר Scope מדויק (Read/Contributor לפי Role)','Incident sharing: ודא Two-way visibility (MSSP רואה + הארגון רואה מה MSSP עשה)','SLA מסמך: זמני תגובה מוסכמים לפי Severity']}},
  {id:'p7-watchlists',pillar:'p7',title:'Watchlists מנוהלות',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Configuration → Watchlists → Create (VIP users, Known malicious IPs, Approved admin IPs)','שילוב ב-Analytics rules: JOIN מול Watchlist להפחתת False positives','Update process: הגדר בעלים ותדירות עדכון (למשל HR feed ל-VIP list)','בדוק תוקף — Watchlists שלא עודכנו > 90 יום']}},
  {id:'p7-automationrules',pillar:'p7',title:'Automation Rules (Orchestration חוצה-Playbooks) מוגדרות',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Automation → Automation rules → Create','דוגמאות: Auto-close alerts אינפורמטיביים מ-Source ידוע כ-Noisy','Auto-assign Incident לפי Tag/Severity לצוות הנכון','Suppress duplicate incidents מ-Analytics rule ספציפי; ודא סדר Priority נכון בין Rules','AI-Powered Playbook Generator (GA 8/2026, חינם — לא דורש Security Copilot): נסה ליצור Playbook ראשון מתיאור טקסט חופשי לפני בנייה ידנית']}},
  {id:'p7-contenthub',pillar:'p7',title:'Content Hub Solutions מותקנות',priority:'low',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Content hub → סקור Solutions זמינות לפי Data connectors מחוברים','התקן Solutions רלוונטיים (Microsoft 365, Entra ID, Azure Activity, Purview) — כוללות Analytics rules + Workbooks + Playbooks מוכנים','עדכון גרסאות: בדוק Updates available','הימנע מהתקנה עודפת (Solutions לא רלוונטיים = רעש)']}},
  {id:'p7-asim',pillar:'p7',title:'ASIM (Advanced Security Information Model) בשימוש',priority:'low',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Hunting/Analytics → השתמש ב-ASIM parsers (למשל imDns, imWebSession) במקום Raw tables ל-Queries חוצי-מקור','יתרון: Query אחד עובד גם אם משנים Connector/Vendor','בדוק Content hub → ASIM parsers מותקנים','Custom parsers: בנה ASIM-compliant parser למקור לא סטנדרטי']}},
  {id:'p7-datalake',pillar:'p7',title:'Sentinel Data Lake — Table Insights + אסטרטגיית Retention',priority:'medium',phase:6,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Data lake → Table insights (חדש 7/2026): נטר Ingestion volume, שינויים Week-over-week, Connectors שהשתתקו — בלי KQL','החלט אילו Tables חייבות Analytics tier (יקר, Real-time) מול Data lake tier (זול, Long retention, לא Real-time)','דוגמה: Logs תפעוליים ל-Compliance/Forensics → Data lake; Logs ל-Detection פעיל → Analytics tier','בדוק חיסכון בפועל: Cost analysis לפני ואחרי מעבר Tables לא-קריטיים ל-Data lake']}},
  {id:'p7-detectionsascode',pillar:'p7',title:'Detections-as-Code (Sentinel Repositories + CI/CD)',priority:'low',phase:6,governance:true,
   guide:{portal:'security.microsoft.com',steps:['Sentinel → Repositories → Connect ל-GitHub repo → נהל Analytics rules, Playbooks, Parsers, Workbooks כקוד','Custom detections (חדש 7/2026): כלול גם Custom detection rules ב-Repository, לא רק Analytics rules','CI/CD pipeline: הגדר Review + Approval לפני Deploy של Detection חדש לפרודקשן','יתרון Governance: Change history מלא + Rollback קל ל-Detection logic']}},

  /* ── P8: CONDITIONAL ACCESS ── */
  {id:'p8-naming',pillar:'p8',title:'Naming Convention מיושמת (CA-XXX-Action-Target)',priority:'high',phase:1,governance:true,
   guide:{portal:'Entra Admin Center',steps:['Conditional Access → Policies → בדוק שכל פוליסה ממושית לפי: CA-[מספר]-[פעולה]-[יעד]-[תנאי]','דוגמאות: CA-001-Require-MFA-AllUsers | CA-010-Block-LegacyAuth','שדה "Description": תעד מטרה, תאריך יצירה, בעל פוליסה','קבוצות Entra: צור BreakGlass-Exclude לחריגות','הכן טבלת Inventory ב-Excel/Confluence עם כל הפוליסות']}},
  {id:'p8-breakglass',pillar:'p8',title:'Break Glass excluded מכל פוליסות CA',priority:'critical',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Users → New User → breakglass1@[tenant].onmicrosoft.com (סיסמה 30+ תווים, ללא מייל)','Assign: Global Administrator | ללא MFA | ללא PIM | ללא CA exclusion אחר','צור קבוצת Entra: "BreakGlass-Exclude" → הוסף שני חשבונות','כל פוליסת CA → Assignments → Users → Exclude: BreakGlass-Exclude','Log Analytics Alert: כל Sign-in של חשבון זה → Teams notification מיידי']}},
  {id:'p8-mfa-all',pillar:'p8',title:'CA-001: MFA נדרש לכל המשתמשים',priority:'critical',phase:1,
   guide:{portal:'Entra Admin Center',steps:['Conditional Access → + New Policy → שם: CA-001-Require-MFA-AllUsers-AllApps','Users: All users | Exclude: BreakGlass-Exclude','Cloud apps: All cloud apps','Grant: Require multifactor authentication','Status: Report-only (7 ימים) → בדוק Insights → לאחר מכן Enabled']}},
  {id:'p8-legacy',pillar:'p8',title:'CA-002: Legacy Authentication חסום לחלוטין',priority:'critical',phase:1,
   guide:{portal:'Entra Admin Center',steps:['+ New Policy → שם: CA-002-Block-LegacyAuth-AllUsers-AllApps','Users: All | Cloud Apps: All cloud apps','Conditions → Client apps: סמן Exchange ActiveSync + Other clients (בטל שאר ה-checkboxes)','Grant: Block access','Status: Enabled — אין צורך ב-Report-Only לפוליסת Block (בדוק Sign-in logs 30 יום קודם)']}},
  {id:'p8-mfa-admin',pillar:'p8',title:'CA-003: Phishing-Resistant MFA לאדמינים',priority:'critical',phase:1,
